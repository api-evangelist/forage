aid: forage
name: Forage
description: Forage is a mission-driven payments company and one of only three payment
  processors approved by the USDA Food and Nutrition Service (FNS) to accept SNAP EBT
  and EBT Cash online. Forage gives grocery retailers, marketplaces, and platforms the
  API, SDKs, and regulatory expertise to add government-benefit tender (SNAP, EBT Cash,
  and HSA/FSA) to online and in-store checkout. The Forage Payments API tokenizes EBT
  cards, runs PIN-secured balance inquiries, and creates, captures, voids, and refunds
  EBT payments and orders, backed by JavaScript, iOS, Android, and POS Terminal SDKs,
  webhooks for order/payment/refund events, and daily CSV reconciliation reports.
