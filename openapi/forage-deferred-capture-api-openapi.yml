openapi: 3.2.0
info:
  title: Forage Payments Deferred Capture API
  description: The Forage Payments API is a REST API for processing Electronic Benefits Transfer (EBT) payments (SNAP and EBT Cash) in your e-commerce or in-store application.
  contact:
    name: API Support
    email: engineering@joinforage.com
  version: '2025-08-04'
servers:
- url: https://{environment}.joinforage.app
  variables:
    environment:
      default: api.sandbox
      enum:
      - api
      - api.sandbox
security: []
tags:
- name: Deferred Capture
paths:
  /api/payments/{payment_ref}/capture_payment/:
    parameters:
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `Payment` object, returned when the [`Payment` was created](https://docs.joinforage.app/reference/payments#create-a-payment).
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    post:
      tags:
      - Deferred Capture
      summary: Capture an EBT or HSA/FSA Payment
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/payments/cc3175bfea/capture_payment/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '{\n  \"capture_amount\": 11.98,\n  \"qualified_healthcare_total\": 11.98,\n  \"qualified_healthcare_subtotal\": 11.98,\n  \"product_list\": [\n    {\n      \"gtin\": \"00041260013003\",\n      \"name\": \"Sample Healthcare Product\",\n      \"unit_price\": 5.99,\n      \"quantity\": 2,\n      \"eligibility\": \"hsa_fsa\"\n    }\n  ]\n}\n'\n"
      description: '> 📘 Forage SDK Integrations And HSA/FSA Only

        >

        > This endpoint is only relevant to Forage SDK integrations and HSA/FSA payments.

        >

        > Instead of calling a front-end SDK method to capture a payment, you can use this endpoint to capture a payment from the backend.


        A `POST` request to `/payments/{payment_ref}/capture_payment/` captures an existing Forage Payment.


        On success, Forage automatically begins processing the charge to the customer, so this endpoint has immediate financial side effects.


        The API responds with a Payment object that represents the transaction. For EBT payments the response also includes complete `receipt` information.


        For HSA/FSA payments, the `capture_amount` must be less than or equal to the original `amount` field in the `Payment` object.


        > ⚠️ Incompatible Fields for EBT Transactions

        >

        > Avoid using `capture_amount`, `qualified_healthcare_total`, `qualified_healthcare_subtotal`, and `product_list`. Including these fields in EBT transactions may cause unexpected behavior.


        Once an HSA/FSA payment is captured, the `amount` field in the `Payment` object is updated to match the `capture_amount`. The originally authorized amount moves to the `authorization_amount` field, which is used only for debugging and bookkeeping.


        > ⚠️ Capture Requests Must Be Server-Side

        >

        > To keep your app secure, requests to capture a payment should only be generated from the server-side.'
      operationId: CaptureAPayment-DeferredCapture
      security:
      - OAuth2:
        - internal
        - pinpad_only
      - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CapturePayment'
      responses:
        '200':
          description: __OK__ - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Bad Request
