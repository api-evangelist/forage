openapi: 3.2.0
info:
  title: Forage Payments Order Payments API
  description: The Forage Payments API is a REST API for processing Electronic Benefits Transfer (EBT) payments (SNAP and EBT Cash) in your e-commerce or in-store application.
  contact:
    name: API Support
    email: engineering@joinforage.com
  version: '2025-08-04'
servers:
- url: https://{environment}.joinforage.app
  variables:
    environment:
      default: api.sandbox
      enum:
      - api
      - api.sandbox
security: []
tags:
- name: Order Payments
paths:
  /api/orders/{order_ref}/payments/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage Order object, returned when the order’s parent [Session](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
        default: cc3175bfea
    get:
      parameters:
      - $ref: '#/components/parameters/BearerTokenHeader'
      - $ref: '#/components/parameters/MerchantAccountHeader'
      - $ref: '#/components/parameters/APIVersionHeader'
      tags:
      - Order Payments
      summary: Retrieve all OrderPayments for an Order
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/payments/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'accept: application/json'\n"
      description: 'A `GET` request to `/orders/{order_ref}/payments/` retrieves all `OrderPayments` associated with the provided `order_ref`.


        On success, the API responds with an array of `OrderPayments`.'
      operationId: GetAllPayments
      security:
      - OAuth2:
        - hosted_checkout
        - pinpad_only
        - internal
      responses:
        '200':
          description: __OK__ - Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderPaymentResponse'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
                  summary: Expired Session Token
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: expired_session_token
                      message: This token has expired
                      source:
                        resource: Session_Token
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '404':
          description: __Not Found__ - The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/orders/{order_ref}/payments/
                errors:
                - code: resource_not_found
                  message: Order with ref {order_ref} does not exist for current Merchant with FNS {fns_number}
                  source:
                    resource: Orders
                    ref: '{order_ref}'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/orders/{order_ref}/payments/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
      x-operation-id-source: normalized
      x-operation-id-original: Get all payments
  /api/orders/{order_ref}/payments/{payment_ref}/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `OrderPayment` object, returned when the [`OrderPayment` was created](https://docs.joinforage.app/reference/create-order-payment).
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    get:
      parameters:
      - $ref: '#/components/parameters/BearerTokenHeader'
      tags:
      - Order Payments
      summary: Retrieve an OrderPayment
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/payments/cc3175bfea/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'accept: application/json'\n"
      description: A `GET` request to `/orders/{order_ref}/payments/{payment_ref}/` retrieves the specified `OrderPayment`.
      operationId: GetAPayment
      security:
      - OAuth2:
        - pinpad_only
        - hosted_checkout
        - internal
      responses:
        '200':
          description: __OK__ - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentResponse'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
                  summary: Expired Session Token
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: expired_session_token
                      message: This token has expired
                      source:
                        resource: Session_Token
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                resource_not_found:
                  summary: Resource Not Found
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: resource_not_found
                      message: Order with ref {order_ref} does not exist for current Merchant with FNS {fns_number}
                    source:
                      resource: Orders
                      ref: '{order_ref}'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
      x-operation-id-source: normalized
      x-operation-id-original: Get a payment
  /api/orders/{order_ref}/payments/{payment_ref}/cancel/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `OrderPayment` object, returned when the [`OrderPayment` was created](https://docs.joinforage.app/reference/create-order-payment).
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    post:
      tags:
      - Order Payments
      summary: Cancel an OrderPayment
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/payments/cc3175bfea/cancel/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json'\n"
      description: '> ⚠️ `OrderPayment`` Updates Must Be Server-Side

        >

        > To keep your app secure, requests to cancel an OrderPayment should only be generated on the server-side.


        A `POST` request to `/orders/{order_ref}/payments/{payment_ref}/cancel/` cancels an existing `OrderPayment`.


        An `OrderPayment` can only be cancelled if its `status` is `requires_confirmation` or `failed`. Because only payments in these unsuccessful states can be canceled, this endpoint has no financial side effects.


        On success, the API responds with the original `OrderPayment` object.'
      operationId: CancelAPayment
      security:
      - OAuth2:
        - internal
        - pinpad_only
      responses:
        '200':
          description: __OK__ - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentResponse'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '403':
          description: __Forbidden__
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: A string that describes the nature of the error.
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: __Not Found__ - The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                errors:
                - code: resource_not_found
                  message: Order with ref {order_ref} does not exist for current Merchant with FNS {fns_number}
                  source:
                    resource: Orders
                    ref: '{order_ref}'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '423':
          $ref: '#/components/responses/Error423'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/cancel/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
      x-operation-id-source: normalized
      x-operation-id-original: Cancel a payment
components:
  schemas:
    ErrorResponseObject:
      type: object
      description: An object that includes details about the error.
      properties:
        path:
          type: string
          description: The requested endpoint.
        errors:
          $ref: '#/components/schemas/ErrorsArray'
    OrderPaymentResponse:
      allOf:
      - $ref: '#/components/schemas/OrderPaymentRequest'
      - type: object
        properties:
          ref:
            type: string
            description: 'A unique reference hash for the Forage `OrderPayment` object.


              _Note:_ `receipt.ref_number` equals `ref`.

              '
            example: cc3175bfea
          status:
            type: string
            description: 'The status of the `OrderPayment`. One of:


              - `authorized`: The `OrderPayment` has been authorized, but not yet captured. Only applicable to HSA/FSA payments, which use an authorize-then-capture flow.

              - `canceled`: The `OrderPayment` object can''t be used.

              - `failed`: If the error is temporary, then this `OrderPayment` can be resubmitted for capture without modification. Check the `receipt.message` field for a description of the error.

              - `processing`: The outcome of the `OrderPayment` is pending.

              - `requires_confirmation`: The `OrderPayment` hasn''t been submitted for processing.

              - `succeeded`: The `OrderPayment` has been successfully processed and will be included in settlement. It can''t be changed.

              '
            enum:
            - authorized
            - canceled
            - failed
            - processing
            - requires_confirmation
            - succeeded
            example: requires_confirmation
          last_processing_error:
            type:
            - object
            - 'null'
            description: The code and message values corresponding to the most recent [Payments API error](https://docs.joinforage.app/reference/errors#payments-api-errors).
            properties:
              code:
                type: string
              message:
                type: string
          created:
            type: string
            format: date-time
            description: A UTC timestamp, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string, of when the `OrderPayment` was created.
            example: '2021-06-16T00:11:50.000000Z'
          updated:
            type: string
            format: date-time
            description: A UTC timestamp, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string, of when the `OrderPayment` was last modified.
            example: '2021-06-16T00:11:50.000000Z'
          success_date:
            type:
            - string
            - 'null'
            format: date-time
            description: A UTC timestamp, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string, of when the `status` of the `OrderPayment` is `succeeded`. This value is always `null` when the `OrderPayment` is first created.
            example: '2021-06-16T00:11:50.000000Z'
          tpp_lookup_id:
            type:
            - string
            - 'null'
            description: 'This value is always null for `OrderPayments` resulting from Custom Sessions. It’s most relevant to Fully Hosted Sessions, which process credit/debit payments.


              A value that merchants can use to associate this payment with a credit/debit payment processed by a third party processor.


              For Stripe integrations, this is the client secret for a [`PaymentIntent`](https://stripe.com/docs/api/payment_intents).

              '
            example: pi_1DpdZq2eZvKYlo2CAYyzTr8j_secret_lxr4crBJP4txbrg7sqit0XQQO
          order:
            type: string
            description: A unique reference hash for the parent `Order`, as passed in the request to create the `OrderPayment`.
            example: 340129aff3
          merchant:
            type: string
            description: The FNS (Food and Nutrition Service) number of the merchant associated with this `OrderPayment`.
          amount:
            type:
            - string
            - 'null'
            format: decimal
            description: The amount charged to the payment method, in USD. Null until the payment is captured.
          merchant_fixed_settlement:
            type:
            - string
            - 'null'
            format: decimal
            description: The fixed amount in USD restored to the merchant from EBT Cash payments before the `platform_fee` split. Null when not set.
          platform_fixed_settlement:
            type:
            - string
            - 'null'
            format: decimal
            description: The fixed amount in USD the platform takes from EBT Cash payments before the `platform_fee` split. Null when not set.
          external_location_id:
            description: A unique identifier, provided by the merchant or platform (not Forage), that indicates the physical fulfillment location for the order. Null when not provided.
        required:
        - ref
        - order
        - merchant
        - status
        - created
        - updated
    OrderPaymentRequest:
      type: object
      description: This object represents a one-time payment, charged to a single payment method, associated with a specific Forage Order.
      properties:
        funding_type:
          type: string
          description: 'A string that represents the type of tender. One of:


            - `benefit`

            - `credit_tpp`

            - `ebt_cash`

            - `ebt_snap`

            '
          enum:
          - benefit
          - credit_payfac
          - credit_tpp
          - ebt_cash
          - ebt_snap
          - wic
          default: ebt_snap
        amount:
          type: string
          format: decimal
          description: 'A positive decimal number that represents how much to charge the `PaymentMethod` in USD. Precision is supported to the penny.


            This value must match the `ebt_cash_total` or `snap_total` value that was passed in the request that [created the Custom Capture Session](https://docs.joinforage.app/reference/create-capture-session), depending on the `funding_type`.


            If you need to charge both funding types, then create an `OrderPayment` for each charge, using the same `order_ref` returned when the order''s parent [Payment Capture Session was created](https://docs.joinforage.app/reference/create-capture-session).


            The minimum amount that can be charged is `0.01`.

            '
          example: '25.99'
        description:
          type: string
          description: A string that describes the `OrderPayment`.
          default: An EBT payment
        metadata:
          allOf:
          - $ref: '#/components/schemas/MetadataObject'
          - default: {}
        payment_method:
          type: string
          description: The unique reference hash for the existing Forage [`PaymentMethod`](https://docs.joinforage.app/reference/payment-methods) that is to be charged in this transaction.
          default: b16673fe21
        customer_id:
          $ref: '#/components/schemas/CustomerIDField'
        external_order_id:
          $ref: '#/components/schemas/ExternalOrderIDField'
        merchant_fixed_settlement:
          type:
          - string
          - 'null'
          format: decimal
          description: 'The fixed amount in USD that should be restored to the merchant from EBT Cash payments prior to splitting by the `platform_fee`. Precision is supported to the penny.

            '
          example: '5.11'
        platform_fixed_settlement:
          type:
          - string
          - 'null'
          format: decimal
          description: 'The fixed amount in USD that should be restored to the platform from EBT Cash payments prior to splitting by the `platform_fee`. Precision is supported to the penny.

            '
          example: '5.11'
        external_location_id:
          $ref: '#/components/schemas/ExternalLocationIDField'
      required:
      - funding_type
      - amount
      - description
      - metadata
      - payment_method
    MetadataObject:
      type: object
      description: 'A required object containing merchant-defined key-value pairs to provide additional context for the payment.


        Merchants should use this field to store **reference information** relevant to the transaction (for example, order details, system identifiers, or tracking data). This helps link the payment to records within their system.


        Pass an empty object (`{}`) if no additional information is available.


        > ⚠️ Personally Identifiable Information

        >

        > **Do not include personally identifiable information (PII)** such as names, emails, or payment details.

        '
    ExternalLocationIDField:
      type: string
      description: 'A unique identifier, provided by the merchant or platform (not Forage), that indicates the physical fulfillment location for the order. For example, this field could specify which location of a grocery store chain fulfilled an order.

        '
      example: 6e3b2ff7-51c8-4c64-befa-2eac90f7c3e9
    CustomerIDField:
      type: string
      maxLength: 64
      description: '**⚠️ If you’re integrating Forage with a POS Terminal, then do not use this param. It is only supported for online transactions.**


