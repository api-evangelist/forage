openapi: 3.2.0
info:
  title: Forage Payments Order Refunds API
  description: The Forage Payments API is a REST API for processing Electronic Benefits Transfer (EBT) payments (SNAP and EBT Cash) in your e-commerce or in-store application.
  contact:
    name: API Support
    email: engineering@joinforage.com
  version: '2025-08-04'
servers:
- url: https://{environment}.joinforage.app
  variables:
    environment:
      default: api.sandbox
      enum:
      - api
      - api.sandbox
security: []
tags:
- name: Order Refunds
paths:
  /api/orders/{order_ref}/refund_all/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    post:
      tags:
      - Order Refunds
      summary: Create a refund for an entire Order
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/refund_all/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"reason\": \"Order could not be delivered.\",\n  \"metadata\": {},\n  \"external_order_id\": \"<external-order-id>\"\n}\n'\n"
      description: '> ⚠️ Refunding Entire Orders Must Be Server-Side

        >

        > To keep your app secure, requests to refund an entire Order should only be generated on the server-side.


        A `POST` request to `/orders/{order_ref}/refund_all/` refunds an entire `Order`. It tells Forage’s servers to create an `OrderRefund` for every associated `OrderPayment`, and to refund all charges to their original payment methods, net any already processed refunds. This request has immediate financial side effects.


        On success, the API responds with the original `Order`. The `refunds` field details a list of reference hashes, `refund_refs`, for all of the `OrderRefunds` that Forage created as part of the refund process.


        If there are any `OrderRefunds` still processing when you send the `POST`, then the API returns a `400` until those refunds have resolved.


        To retrieve information about a particular `OrderRefund` in the list, send a `GET` to `/orders/{order_ref}/refunds/{refund_ref}/`.


        > ⚠️ Retrieving Refund Receipt Info

        >

        > This endpoint does not return `receipt` information.

        >

        > To retrieve transaction information to display to a customer, send periodic `GET` requests to `/orders/{order_ref}/refunds/{refund_ref}/` for every`OrderRefund` returned in the `refunds` field until the status of each is `succeeded`. Then, confirm that the `receipt.balance.updated` timestamp is no longer changing and retrieve the latest balance.


        > 📘 Webhooks For Refund Status Updates

        >

        > Forage sends a `REFUND_STATUS_UPDATED` webhook when the status of a refund changes. Check out the guide to Forage webhooks for instructions on how to listen for the event.'
      operationId: RefundOrder
      security:
      - OAuth2:
        - internal
        - hosted_checkout
        - pinpad_only
      requestBody:
        $ref: '#/components/requestBodies/BulkRefund'
      responses:
        '200':
          $ref: '#/components/responses/Order200'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body:
                  summary: Cannot Parse Request Body
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: cannot_parse_request_body
                      message: 'Parsing ''reason'' field failed with message: This field is required'
                      source:
                        resource: Refunds
                        ref: ''
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                order_already_refunded:
                  summary: Order Already Refunded
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: order_already_refunded
                      message: Payments associated with order ref {order_ref} have already been fully refunded.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                order_not_succeeded:
                  summary: Order Not Succeeded
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: order_not_succeeded
                      message: Order with ref {order_ref} has not completed successfully and therefore cannot be refunded. Current order status is {order_status}
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
                wait_for_batch_refund:
                  summary: Wait for Batch Refund
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: wait_for_batch_refund
                      message: Order with ref {order_ref} has other active refunds and therefore cannot be batch refunded. Existing refunds in processing state are {refund_ref}
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '403':
          description: __Forbidden__
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: A string that describes the nature of the error.
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: __Not Found__ - The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/orders/{order_ref}/refund_all/
                errors:
                - code: resource_not_found
                  message: Order with ref {order_ref} does not exist for current Merchant with FNS {fns_number}
                  source:
                    resource: Orders
                    ref: '{order_ref}'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '423':
          $ref: '#/components/responses/Error423'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/orders/{order_ref}/refund_all/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
      x-operation-id-source: normalized
      x-operation-id-original: Refund order
  /api/orders/{order_ref}/refund_by_product/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order's parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    post:
      tags:
      - Order Refunds
      summary: Create refunds for specific products in an Order
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/refund_by_product/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"products\": [\n    {\n      \"id\": 1235,\n      \"quantity\": \"2.00\"\n    }\n  ],\n  \"reason\": \"Product is damaged\",\n  \"metadata\": {}\n}\n'\n"
      description: '> ⚠️ Product Refunds Must Be Server-Side

        >

        > To keep your app secure, requests to refund specific products should only be generated on the server-side.


        A `POST` request to `/orders/{order_ref}/refund_by_product/` creates refunds for specific products in an `Order`. It tells Forage''s servers to create `OrderRefund` objects for the specified products and refund the appropriate amounts to their original payment methods. This request has immediate financial side effects.


        On success, the API responds with an array of refund objects that represent the transactions and a `201` HTTP status code.


        ### HTTP STATUS 201


        This endpoint always returns a `201`, even if some refund attempts fail, because Forage always creates refund objects to preserve a record of the attempted transactions. To make sure that the refunds were successful, check that the `status` of each refund is `succeeded`. Send periodic `GET` requests to `/orders/{order_ref}/refunds/{refund_ref}/` to retrieve the updated objects. If the status is `failed`, then inspect the `last_processing_error` field of the response object for information about the error.


        > 📘 Webhooks For Refund Status Updates

        >

        > Forage sends a `REFUND_STATUS_UPDATED` webhook when the status of a refund changes. Check out the guide to Forage webhooks for instructions on how to listen for the event.'
      operationId: CreateRefundsByProduct
      security:
      - OAuth2:
        - internal
        - hosted_checkout
        - pinpad_only
      requestBody:
        $ref: '#/components/requestBodies/OrderRefundByProduct'
      responses:
        '201':
          $ref: '#/components/responses/OrderRefundByProduct201'
        '400':
          description: __Bad Request__ - The request was not accepted because of an error in the request body or path.
          content:
