      x-operation-id-original: Create refunds by product
  /api/orders/{order_ref}/refunds/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    post:
      parameters:
      - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
      - $ref: '#/components/parameters/MerchantAccountHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/APIVersionHeader'
      tags:
      - Order Refunds
      summary: Create a refund for part of an Order
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/refunds/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"payment\": \"f587edf124\",\n  \"amount\": \"25.99\",\n  \"reason\": \"Order could not be delivered.\",\n  \"metadata\": {},\n  \"merchant_fixed_settlement\": \"5.11\",\n  \"platform_fixed_settlement\": \"5.11\",\n  \"external_order_id\": \"<external-order-id>\"\n}\n'\n"
      description: '> ⚠️ Partial Refunds Must Be Server-Side

        >

        > To keep your app secure, requests to refund part of an Order should only be generated on the server-side.


        > ⚠️ API Version Requirements

        >

        > You must use Forage version `2024-01-08` or higher for this endpoint to return populated `receipt` data. Earlier versions return the receipt value as null, so to retrieve the data you need to send `GET` requests to `/orders/{order_ref}/refunds/{refund_ref}/` until the status of the refund is `succeeded`.


        A `POST` request to `/orders/{order_ref}/refunds/` refunds part of an `Order`. It tells Forage’s servers to refund a specific `amount` of a single `OrderPayment` associated with the `Order`. This request has immediate financial side effects.


        On success, the API responds with an `OrderRefund` that represents the transaction and a `201` HTTP status code.


        ### HTTP STATUS 201


        This endpoint always returns a `201`, even if the refund attempt fails, because Forage always creates an `OrderRefund` to preserve a record of the attempted transaction. To make sure that the refund was successful, check that the `status` is `succeeded`. Send periodic `GET` requests to `/orders/{order_ref}/refunds/{refund_ref}/` to retrieve the updated object. If the status is `failed`, then inspect the `last_processing_error` field of the response object for information about the error.'
      operationId: CreateARefund
      security:
      - OAuth2:
        - internal
        - hosted_checkout
        - pinpad_only
      requestBody:
        $ref: '#/components/requestBodies/OrderRefund'
      responses:
        '201':
          description: __Created__ - Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/OrderRefundResponse'
                - type: object
                  properties:
                    refund_errors:
                      type: array
                      items:
                        $ref: '#/components/schemas/ErrorResponseObject'
                      description: 'An array of objects that details information about any refund errors.


                        _Note that this field is only returned when an `OrderRefund` is created. The [retrieve an `OrderRefund`](https://docs.joinforage.app/reference/get-an-order-refund) request omits this field in its response_.

                        '
                example:
                  payment: f587edf124
                  amount: '25.99'
                  reason: Order could not be delivered
                  metadata: {}
                  merchant_fixed_settlement: '5.11'
                  platform_fixed_settlement: '5.11'
                  external_order_id: 1f2ee410-5b47-4130-aec2-40f5eb2108f5
                  ref: 45e3f12a90
                  order: 83b1c754ae
                  merchant: '9000055'
                  funding_type: ebt_snap
                  status: processing
                  last_processing_error: null
                  created: '2021-06-16T00:11:50.000000Z'
                  updated: '2021-06-16T00:11:50.000000Z'
                  receipt:
                    ref_number: 45e3f12a90
                    is_voided: true
                    snap_amount: '25.99'
                    ebt_cash_amount: '10.99'
                    other_amount: '5.99'
                    sales_tax_applied: '5.16'
                    balance:
                      snap: '72.94'
                      non_snap: '32.16'
                      updated: '2021-06-16T00:11:50.000000Z'
                    last_4: '3456'
                    message: Approved
                    transaction_type: Refund
                    created: '2021-06-16T00:11:50.000000Z'
                  tpp_lookup_id: re_3JemUSGfBYJeLEva0af6My64
                  refund_errors: []
        '400':
          description: __Bad Request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body:
                  summary: Cannot Parse Request Body
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: 'Parsing ''reason'' field failed with message: This field is required'
                      source:
                        resource: Refunds
                        ref: ''
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                order_already_refunded:
                  summary: Order Already Refunded
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: order_already_refunded
                      message: Payments associated with order ref {order_ref} have already been fully refunded.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                order_not_succeeded:
                  summary: Order Not Succeeded
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: order_not_succeeded
                      message: Order with ref {order_ref} has not completed successfully and therefore cannot be refunded. Current order status is {order_status}
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                refund_exceeds_order_total:
                  summary: Refund Exceeds Order Total
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: refund_exceeds_order_total
                      message: Requested refund would push the total amount refunded above the original Payment amount. Total amount paid is {amount_paid}. Existing total of refunds is {refund_total}
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '404':
          description: __Not Found__ - The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/orders/{order_ref}/refunds/
                errors:
                - code: resource_not_found
                  message: Order with ref {order_ref} does not exist for current Merchant with FNS {fns_number}
                  source:
                    resource: Orders
                    ref: '{order_ref}'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '423':
          $ref: '#/components/responses/Error423'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/orders/{order_ref}/refunds/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
