              examples:
                cannot_parse_request_body:
                  summary: Cannot Parse Request Body
                  value:
                    path: /api/orders/{order_ref}/refund_by_product/
                    errors:
                    - code: cannot_parse_request_body
                      message: 'Parsing ''reason'' field failed with message: This field is required'
                      source:
                        resource: Refunds
                        ref: ''
                invalid_input_data:
