openapi: 3.2.0
info:
  title: Forage Payments Payment Refunds API
  description: The Forage Payments API is a REST API for processing Electronic Benefits Transfer (EBT) payments (SNAP and EBT Cash) in your e-commerce or in-store application.
  contact:
    name: API Support
    email: engineering@joinforage.com
  version: '2025-08-04'
servers:
- url: https://{environment}.joinforage.app
  variables:
    environment:
      default: api.sandbox
      enum:
      - api
      - api.sandbox
security: []
tags:
- name: Payment Refunds
paths:
  /api/payments/{payment_ref}/refunds/:
    parameters:
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `Payment` object, returned when the original [`Payment` was created](https://docs.joinforage.app/reference/create-a-payment).
      required: true
      schema:
        type: string
        default: cc3175bfea
    post:
      parameters:
      - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
      - $ref: '#/components/parameters/MerchantAccountHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/APIVersionHeader'
      tags:
      - Payment Refunds
      summary: Create a PaymentRefund
      description: '> ⚠️ Refund Requests Must Be Server-Side

        >

        > To keep your app secure, requests to create a PaymentRefund should only be generated on the server-side.


        > ⚠️ API Version Requirements

        >

        > You must use Forage version `2024-01-08` or higher for this endpoint to return populated `receipt` data. Earlier versions return the `receipt` value as `null`, so to retrieve the data you need to send `GET` requests to `/payments/{payment_ref}/refunds/{refund_ref}/` until the `status` of the refund is `succeeded`.


        A `POST` request to `/payments/{payment_ref}/refunds/` tells Forage’s servers to refund an existing `Payment` object. Funds are refunded to the originally charged `PaymentMethod`.


        On success, Forage automatically begins processing the refund, so this request has immediate financial side effects.


        The API responds with a Forage `PaymentRefund` object that represents the transaction and an HTTP `201` status code.


        #### Deferred refunds


        ForageTerminalSDK integrations use this endpoint to complete **deferred refunds**. Here are the steps:


        1. Collect the customer''s PIN using Forage’s POS SDK.

        2. At the appropriate point in your refund workflow, call this endpoint to initiate the refund.

        3. If an error occurs (e.g., *an Invalid PIN*), relay the message back to the POS client immediately so the user is notified promptly.


        #### HTTP `201`


        HTTP `201` is returned even if the refund attempt fails because Forage creates a `PaymentRefund` object to preserve a record of the refund regardless of the transaction outcome. To confirm that the outcome is a success, check that the `status` of the `PaymentRefund` is `succeeded`.


        If the status is `failed`, then for Forage version `2024-01-08` or higher inspect the `receipt.message` field of the response for a description of the error. For earlier Forage versions, send a `GET` to `/payments/{payment_ref}/refunds/` to retrieve updated `receipt` data.'
      operationId: CreateARefund(customCheckout)
      security:
      - OAuth2:
        - internal
        - pinpad_only
      - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PaymentRefund'
      responses:
        '201':
          description: __Created__ - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefundResponse'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body_amount:
                  summary: Cannot Parse Request Body - Missing amount
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Parsing amount field failed with message - This field is required.
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_amount_not_positive:
                  summary: Cannot Parse Request Body - Amount must be positive
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Parsing amount field failed with message - You must provide a positive value for the amount to refund
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_mfs:
                  summary: Cannot Parse Request Body - Merchant Fixed Settlement
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Must include the merchant_fixed_settlement field to determine how funds will be settled!
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_missing_pin:
                  summary: Cannot Parse Request Body - Missing Pin
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Refund for payment ref {payment_ref} requires a pin which is missing
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_platform_fixed_settlement:
                  summary: Cannot Parse Request Body - Platform Fixed Settlement
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Must include the platform_fixed_settlement field to determine how funds will be settled!
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_pos:
                  summary: Cannot Parse Request Body - Missing POS Field
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: POS Terminal refunds requires pos_terminal field to be present in the request body
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_reason_null:
                  summary: Cannot Parse Request Body - Reason is null
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Parsing reason field failed with message - This field may not be null.
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_parse_request_body_reason_required:
                  summary: Cannot Parse Request Body - Reason is required
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_parse_request_body
                      message: Parsing reason field failed with message - This field is required.
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_refund_after_90_days:
                  summary: Cannot Refund After 90 Days
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_refund_after_90_days
                      message: Per federal regulations, refunds to EBT payment methods cannot be processed after 90 days. Payment {payment_ref} succeeded on {}
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_refund_payment_amount:
                  summary: Cannot Refund Payment - No Payment Amount
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_refund_payment
                      message: Only Payments with a non-null amount can be refunded, but Payment with ref {} has no amount provided.
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_refund_payment_missing_pin:
                  summary: Cannot Refund Payment - Missing PIN
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_refund_payment
                      message: Refund for payment ref {} misses a pin. Please use the SDK to collect pin first.
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                cannot_refund_payment_state:
                  summary: Cannot Refund Payment - Payment State Prohibited
                  value:
                    path: /api/payments/{payment_ref}/refunds/
                    errors:
                    - code: cannot_refund_payment
                      message: Only Payments in the succeeded state can be refunded, but Payment with ref {payment_ref} is in the requires_confirmation state
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
