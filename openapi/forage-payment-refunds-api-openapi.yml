  /api/payments/{payment_ref}/refunds/{refund_ref}/:
    parameters:
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `Payment` object, returned when the original [`Payment` was created](https://docs.joinforage.app/reference/create-a-payment).
      required: true
      schema:
        type: string
        default: b873fe62dc
    - name: refund_ref
      in: path
      description: A unique reference hash for the Forage `PaymentRefund` object, returned when the original [`PaymentRefund` was created](https://docs.joinforage.app/reference/create-payment-refund).
      required: true
      schema:
        type: string
        default: 45e3f12a90
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    get:
      parameters:
      - $ref: '#/components/parameters/BearerTokenHeader'
      tags:
      - Payment Refunds
      summary: Retrieve a PaymentRefund for a Payment
      description: 'A `GET` request to `/payments/{payment_ref}/refunds/{refund_ref}/` retrieves a `PaymentRefund` associated with a `Payment`.


        Use this endpoint to retrieve updated `receipt` and `balance` information for a `PaymentRefund` after the initial POST request creates the refund.'
      operationId: GetAPaymentRefund
      security:
      - OAuth2:
        - internal
        - pinpad_only
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PaymentRefund200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/payments/{payment_ref}/refunds/{refund_ref}/
