          $ref: '#/components/responses/TransactionReport200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_filters:
                  summary: Invalid Filter
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: invalid_filters
                      message: '{filter}: required filter is missing'
                      source:
                        resource: Reports
                        ref: ''
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Reports
                        ref: ''
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
        '401':
          description: __Unauthorized__
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '429':
          description: __Too Many Requests__
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Reports
                        ref: ''
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                secure_storage_inaccessible:
                  summary: Secure Storage Inaccessible
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: secure_storage_inaccessible
                      message: Temporarily unable to access data in secure storage. Please try again.
                      source:
                        resource: Reports
                        ref: ''
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /reporting/transactions/
                    errors:
                    - code: unknown_server_error
                      message: Unable to continue
                      source:
                        resource: Reports
                        ref: ''
components:
  requestBodies:
    Token:
      description: Request payload body for server to issue an access token
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              expiration_time:
                type: integer
                description: 'The lifespan of the token in seconds. The acceptable range includes `86400` (one day) to `2592000` (30 days).


                  Defaults to `604800` (7 days), if not set.

                  '
                default: 604800
              grant_type:
                type: string
                description: The constant string `client_credentials`.
              scope:
                type: string
                description: "The token’s permissions level. Possible values include:\n  - `accounts`: This scope is most useful to platforms that support multiple merchants. Use `accounts` to manage merchant-related data, for example to create a `Session` to onboard a new merchant via the `/accounts/merchants/onboarding_session/` endpoint.\n  - `hosted_checkout`: Use this scope for Fully Hosted integrations. Creates a token that only grants access to [create Fully Hosted Sessions](https://docs.joinforage.app/reference/create-session). The default scope.\n  - `pinpad_only`: Use this scope for Custom and SDK integrations. The most permissive token scope. Creates a token that grants access to start Sessions that collect a customer’s EBT Card PIN, and to perform all operations that a customer’s PIN authorizes, including creating payments and payment methods.\n  - `reporting`: The scope required to query`/reporting/` endpoints.\n\nTo create a token with multiple scopes, separate scope names\
                  \ with a space, for example: `hosted_checkout reporting`.\n"
                default: hosted_checkout
            required:
            - grant_type
    RevokeToken:
      description: Request payload body for server revoke single token
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/RevokeTokenRequest'
    BulkRevokeTokens:
      description: Request payload body for server bulk revoke tokens
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkRevokeTokenRequest'
    SessionToken:
      description: Optional parameters to pass when creating a session token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionTokenRequest'
    PaymentMethod:
      description: A PaymentMethod to add to or update on the system.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: object
              properties:
                card:
                  oneOf:
                  - $ref: '#/components/schemas/EBTCard'
                  - $ref: '#/components/schemas/StripeCard'
                  - $ref: '#/components/schemas/OtherNonEBTCard'
    PaymentMethodUpdate:
      description: The information to update about a `PaymentMethod`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentMethodUpdateRequest'
    BalanceSession:
      description: Pass the following fields in the body of the request to `/balance_sessions/` to start a Custom Balance Check `Session`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BalanceSessionRequest'
    CaptureSession:
      description: Pass the following fields in the body of the request to `/capture_sessions/` to initiate a Custom Capture `Session`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomCaptureSessionRequestBody'
    FullyHostedSession:
      description: Pass the following fields in the body of the request to `/sessions/` to start a Fully Hosted `Session`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FullyHostedSessionRequest'
    OrderUpdate:
      description: Pass the following request body to update an Order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderUpdateRequest'
    Payment:
      description: Object which represents a single charge of a given amount to one payment method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequest'
    BulkRefund:
      description: Forage attaches the below parameters to every OrderRefund created as part of refunding the entire order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkRefundRequest'
    OrderRefundByProduct:
      description: Pass the below parameters to create refunds for specific products in an Order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderRefundByProductRequest'
    OrderRefund:
      description: Pass the below parameters to create an OrderRefund.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderRefundRequest'
    CreatePayment:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PaymentRequest'
            - required:
              - amount
              - funding_type
              - payment_method
              - delivery_address
              - is_delivery
              - description
              - metadata
    CapturePayment:
      description: A request body to pass to `/payments/{payment_ref}/capture_payment/`. Required for HSA/FSA payments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapturePaymentRequest'
    CollectPinBackend:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollectPinBackendRequest'
    AuthorizePayment:
      description: A request body to pass to `/payments/{payment_ref}/authorize/`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizePaymentRequest'
    PaymentRefund:
      description: Pass the following fields in the body of the request to `/payments/{payment_ref}/refunds/` to initiate a `PaymentRefund`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRefundRequest'
  responses:
    Token200:
      description: __OK__ - Success
      headers:
        X-REMAINING-TOKENS:
          schema:
            type: integer
          description: Number of remaining tokens available for your app.
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token:
                type: string
                description: The authentication token to include as the bearer token in the header of server-side requests.
                example: sandbox_uXpcGMAMs7hhbw9JifUuJlzUZS3zWD
              expires_in:
                type: integer
                description: The number of seconds until the token expires.
                example: 36000
              token_type:
                type: string
                description: The type of the token, the constant string `"Bearer"`.
                default: Bearer
              scope:
                type: string
                description: The token's permissions level.
                example: hosted_checkout
    SessionToken201:
      description: __Created__ - Success
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
                description: The authentication token to include as the bearer token in the `Authorization` header of client-side requests and as a parameter to SDK methods.
                example: sandbox_eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJhIjozOTYsImV4cCI6MTY4ODA4MTAzMH0.G9G97BGqEWpu3BfBo23MEVjr37ZdERplXD6cOx8BbiM
              expiration_date:
                type: string
                description: A UTC timestamp that indicates when the token expires, represented as an [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) date-time string.
                example: '2023-08-02T20:07:07-07:00'
    PaymentMethod200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenizedPaymentMethod'
    Error401:
      description: __Unauthorized__ Missing valid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseObject'
    Error500:
      description: __Server Errors__ Something went wrong on Forage's servers. Try again.
    PayoutReport200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayoutReportResponse'
    PayoutTransactionReport200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayoutTransactionReportResponse'
    TransactionReport200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionReportResponse'
    BalanceSession200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BalanceSessionResponse'
    Error423:
      description: __Locked__ - The request could not be completed because the target resource is currently locked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseObject'
          examples:
            resource_locked:
              summary: Resource Locked
              value:
                path: /api/example_path/
                errors:
                - code: resource_locked
                  message: Request could not be completed because the resource is currently locked. Please try again later.
                  source:
                    resource: Idempotency_Key
                    ref: ''
    CustomPaymentCapture200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/SessionResponse'
            - $ref: '#/components/schemas/CustomCaptureSessionRequest'
            example:
              status: draft
              delivery_address:
                city: San Francisco
                country: US
                line1: 1856 Market St.
                state: CA
                zipcode: '94102'
              is_delivery: false
              payment_details:
                snap_payment:
                  ref: b29dj92e4g
                  amount: 20.12
                  metadata: {}
                  payment_method: fsdf45345
                  description: A SNAP payment
                  funding_type: ebt_snap
                ebt_cash_payment:
                  ref: c4gdj92e4g
                  amount: 25.99
                  metadata: {}
                  payment_method: fsdf45345
                  description: An EBT Cash payment
                  funding_type: ebt_cash
              supported_benefits:
              - snap
              - non_ebt
              ref: b873fe62dc
              success_date: null
              receipt: null
              customer_id: null
              is_commercial_shipping: null
              success_redirect_url: https://www.your-app.com/?status=SUCCEEDED
              cancel_redirect_url: https://www.your-app.com/?status=CANCELED
              redirect_url: https://checkout.sandbox.joinforage.app/payment?order=b873fe62dc&merchant=9000055
              previous_errors: []
    FullyHostedSession200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FullyHostedSessionResponse'
    Order200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    OrderRefundByProduct201:
      description: __Created__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderRefundByProductResponse'
    OrderRefund200:
      description: __OK__ - Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderRefundResponse'
    PaymentRefund200:
      description: Successful Refund response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRefundResponse'
  parameters:
    CreateAuthenticationTokenHeader:
      name: Authorization
      in: header
      description: An OAuth 2.0 credential that validates the request. Pass the the Client ID and Client Secret from the Forage dashboard, separated by a colon, as in `<client_id>:<client_secret>`, through a base64 encoding function. Send this encoded value in the header of the request after the word Basic, as in `Basic <encoded_credentials>`.
      schema:
        type: string
      required: true
    AuthenticationBearerTokenHeader:
      name: Authorization
      in: header
      description: An OAuth 2.0 [authentication token](https://docs.joinforage.app/docs/authentication#authentication-tokens) that validates the request. Send a `POST` to the [`/o/token/`](https://docs.joinforage.app/reference/create-authentication-token) endpoint to generate an authentication token. Pass the token in this header after the word `Bearer` and a whitespace, for example `Bearer <api_key>`.
      schema:
        type: string
      required: true
    MerchantAccountHeader:
      name: Merchant-Account
      in: header
      description: A unique merchant ID that Forage provides during onboarding, as in `123ab45c67`. The Merchant ID can be found in the Forage [sandbox](https://dashboard.sandbox.joinforage.app/login/) or [production](https://dashboard.joinforage.app/login/) dashboard.
      schema:
        type: string
      required: true
    BearerTokenHeader:
      name: Authorization
      in: header
      description: An OAuth 2.0 bearer token that validates the request. You can use either a short-lived [session token](https://docs.joinforage.app/docs/authentication#session-tokens) if the request is coming from the front-end, or an [authentication token](https://docs.joinforage.app/docs/authentication#authentication-tokens) for server-side requests. Pass the token in this header after the word `Bearer` and a whitespace, for example `Bearer <api_key>`.
      schema:
        type: string
      required: true
    MerchantAccountHeaderPaymentMethod:
      name: Merchant-Account
      in: header
      description: 'A unique merchant ID that Forage provides during onboarding, as in `123ab45c67`. The Merchant ID can be found in the Forage [sandbox](https://dashboard.sandbox.joinforage.app/login/) or [production](https://dashboard.joinforage.app/login/) dashboard.


        Pass a `Merchant-Account` header to create a `PaymentMethod` associated with a specific merchant account for routing and reporting purposes. **This header does not restrict `PaymentMethod`s to a single merchant account. `PaymentMethod`s are tenant-scoped and can be used across all merchant accounts within the same tenant.**

        '
      schema:
        type: string
      required: true
    APIVersionHeader:
      name: API-Version
      in: header
      description: 'The [Forage version](https://docs.joinforage.app/reference/version-history), represented as a string with the format of a `YYYY-MM-DD` date.


        If not specified in the request header, then the version defaults to the value set in the Forage dashboard.

        '
      schema:
        type: string
      required: false
    StartDateQueryParam:
      name: start_date
      in: query
      description: 'The date that the reporting period starts, represented as an [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) UTC date string, inclusive. The result set includes all reported items that occurred on the date.

        '
      required: true
      schema:
        type: string
        format: date
    EndDateQueryParam:
      name: end_date
      in: query
      description: 'The date that the reporting period ends, represented as an [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) UTC date string, inclusive. The result set includes all reported items that occurred on the date.

        '
      required: true
      schema:
        type: string
        format: date
    CursorQueryParam:
      name: cursor
      in: query
      description: The starting point for the `results`, as returned in a previous `/reporting/` request. Find a cursor in the URL returned in the `next` and/or `previous` response values.
      schema:
        type: string
    LimitQueryParam:
      name: limit
      in: query
      description: 'The maximum number of objects to include in the `results` array. Not to exceed `1000`. If the limit exceeds `1000`, then Forage returns a `400` error response.


        Defaults to `100`.

        '
      required: false
      schema:
        type: integer
        default: 100
    StatusQueryParam:
      name: status
      in: query
      description: The status of the `Orders` to be returned in the response. `succeeded` is the only currently supported value, instructing the `start_date` and `end_date` params to refer to the order’s `success_date`, rather than its `created` value. The `status` filter has no effect if any other value is applied or if excluded from the request.
      required: false
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: An alphanumeric key that clients can use to identify repeated requests that are dropped in transit. Generate a distinct key for every unique request and only re-use keys for retries.
      schema:
        type: string
      required: true
  schemas:
    RevokeTokenRequest:
      type: object
      description: The configuration for single token revocation.
      properties:
        client_id:
          type: string
          description: The client ID for your application, found in the Forage dashboard ([sandbox](https://dashboard.sandbox.joinforage.app/), [production](https://dashboard.joinforage.app/)).
        client_secret:
          type: string
          description: The client secret for your application, found in the Forage dashboard ([sandbox](https://dashboard.sandbox.joinforage.app/), [production](https://dashboard.joinforage.app/)).
        token:
          type: string
          description: The access token to be revoked.
      required:
      - token
      - client_id
      - client_secret
    ErrorsArray:
      type: array
      description: An array with information about the error.
      items:
        type: object
        properties:
          code:
            type: string
            description: A short string that represents the error.
          message:
            type: string
            description: A developer-facing message with more details about the error, not to be displayed to customers.
          source:
            type: object
            properties:
              resource:
                type: string
                description: The type of the Forage resource involved in the error.
              ref:
                type: string
                description: If applicable, the ten character reference hash of the Forage resource that caused the error. An empty string if no specific individual resource was involved.
          details:
            type: object
            description: Additional details about the error, if applicable.
      example: []
    ErrorResponseObject:
      type: object
      description: An object that includes details about the error.
      properties:
        path:
          type: string
          description: The requested endpoint.
        errors:
          $ref: '#/components/schemas/ErrorsArray'
    BulkRevokeTokenRequest:
      type: object
      description: The configuration for the bulk token revocation.
      properties:
        client_id:
          type: string
          description: The client ID for your application, found in the Forage dashboard ([sandbox](https://dashboard.sandbox.joinforage.app/), [production](https://dashboard.joinforage.app/)).
        client_secret:
          type: string
          description: The client secret for your application, found in the Forage dashboard ([sandbox](https://dashboard.sandbox.joinforage.app/), [production](https://dashboard.joinforage.app/)).
        revoke_count:
          type: integer
          description: The number of tokens to revoke, between `1` and `1000`. Tokens are revoked in chronological order based on expiry time.
      required:
      - client_id
      - client_secret
      - revoke_count
    SessionTokenRequest:
      type: object
      description: 'Optional parameters to pass when creating a session token.

        '
      properties:
        customer_id:
          type: string
          maxLength: 64
          description: 'A unique identifier for the end customer. This value allows us to scope further actions to this user.


            Each customer should only have one unique `customer_id` and it should be consistent across sessions.

            '
    BalanceResponse:
      type: object
      description: An object that represents an EBT cardholder's account balance.
      properties:
        id:
          type: integer
          description: The unique identifier for the balance record.
          example: 12345
        snap:
          type: string
          format: currency
          description: The available SNAP balance in USD on the customer’s EBT Card, represented as a numeric string.
        non_snap:
          type: string
          format: currency
          description: The available EBT Cash balance in USD on the customer's EBT Card, represented as a numeric string.
        updated:
          type: string
          format: date-time
          description: A UTC timestamp that indicates when the funds in the account last changed, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string.
        sequence_number:
          type: string
          description: A transaction number for this `PaymentMethod`'s most recent balance check. Returned only for POS Terminal transactions; omitted from online merchant balance checks.
    EBTCardResponse:
      type: object
      description: An object that details information about the EBT Card.
      properties:
        last_4:
          type: string
          description: The last four digits of the EBT Card number.
        created:
          type: string
          format: date-time
          description: A UTC timestamp that indicates when the EBT `PaymentMethod` was created, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string.
        token:
          type: string
          description: A token that Forage can use to look up the EBT Card in secure storage.
        state:
          type: string
          description: The two-letter abbreviation for the US state that issued the EBT Card (e.g. `CA`).
        fingerprint:
          type: string
          description: '⚠️ Deprecated. Please use `fingerprint_v2` instead. A unique hash based on the card PAN. The `fingerprint` is constant for a card PAN, no matter the `customer_id`. Use the `fingerprint` to track card usage for fraud prevention.

            '
        fingerprint_v2:
          type: string
          description: A unique hash based on the card PAN. The `fingerprint_v2` is constant for a card PAN, no matter the `customer_id`. Use the `fingerprint_v2` to track card usage for fraud prevention.
    NonEBTCard:
      type: object
      description: If a [credit/debit PSP](https://docs.joinforage.app/docs/ebt-online-101#creditdebit-payment-service-provider-psp) other than Stripe processes the payment, then this object details information about the non-EBT Card.
      properties:
        brand:
          type: string
          description: 'The card brand. One of:

            - `amex`

            - `discover`

            - `mastercard`

            - `visa`

            '
          enum:
          - amex
          - discover
          - mastercard
          - visa
          example: visa
        exp_month:
          type: number
          description: The expiration month as listed on the card, without any preceding `0` (e.g. `4` instead of `04`).
          example: 3
        exp_year:
          type: number
          description: The two-digit expiration year listed on the card (e.g. `21`).
          example: 21
        last_4:
          type: string
          description: The last four digits of the card number.
          example: '6008'
      required:
      - brand
      - cvc
      - last_4
      - exp_month
      - exp_year
    OtherNonEBTCard:
      allOf:
      - $ref: '#/components/schemas/NonEBTCard'
      - type: object
        description: If a [credit/debit PSP](https://docs.joinforage.app/docs/ebt-online-101#creditdebit-payment-service-provider-psp) other than Stripe processes the payment, then this object details information about the non-EBT Card.
        properties:
          payment_profile_id:
            type: string
            description: A unique PSP-provided identifier for the payment.
            example: pm_123456789012345
          customer_profile_id:
            type: string
            description: A unique PSP-provided identifier for the customer.
            example: cus_123456789012345
        required:
        - payment_profile_id
        - customer_profile_id
    StripeCard:
      allOf:
      - $ref: '#/components/schemas/NonEBTCard'
      - type: object
        description: If Stripe is the credit/debit [PSP](https://docs.joinforage.app/docs/ebt-online-101#creditdebit-payment-service-provider-psp), then this object details information about the non-EBT Card.
        properties:
          payment_method_id:
            type: string
            description: The unique identifier for the Stripe PaymentMethod that represents the customer's payment instrument.
            example: pm_123456789012345
          psp_customer_id:
            type: string
            description: The unique Stripe identifier for the cardholder.
            example: cus_123456789012345
          is_hsa_fsa:
            type: boolean
            description: Indicates whether the card is an HSA/FSA card.
          bin:
            type: string
            description: The BIN portion of the card number.
            example: '400005'
          issuer:
            type: string
            description: The name of the card issuer.
            example: Lewis & Clark Bank
          address_postal_code_check:
            type: string
            description: 'The result of any check done on the delivery address zip code. One of:

              - `pass`: The provided information is correct and matches the data on file with the card issuer.

              - `fail`: The provided information is incorrect and does not match the data on file.

              - `unavailable`: The card issuer will not perform the check.

              - `unchecked`: The information was provided but has not yet been checked by the card issuer.

              '
            enum:
            - pass
            - fail
            - unavailable
            - unchecked
            example: pass
          cvc_check:
            type: string
            description: 'The result of any check done on the CVC. One of:

              - `pass`: The provided information is correct and matches the data on file with the card issuer.

              - `fail`: The provided information is incorrect and does not match the data on file.

              - `unavailable`: The card issuer will not perform the check.

              - `unchecked`: The information was provided but has not yet been checked by the card issuer.

              '
            enum:
            - pass
            - fail
            - unavailable
            - unchecked
            example: pass
        required:
        - payment_method_id
        - psp_customer_id
    PaymentMethod:
      type: object
      description: 'An object that represents a customer''s payment instrument.

        '
      properties:
        type:
          type: string
          description: 'The card type. One of:


            - `credit`

            - `debit`

            - `prepaid`

            - `ebt`


            ⚠️ The `type` value can only be `credit`, `debit`, or `prepaid` in a [Fully Hosted](https://docs.joinforage.app/docs/fully-hosted) or [HSA/FSA](https://docs.joinforage.app/docs/enable-hsa-fsa-payments) integration.

            '
          enum:
          - credit
          - debit
          - prepaid
          - ebt
        reusable:
          type: boolean
          description: Whether the `PaymentMethod` can be reused.  If `false`, then the `PaymentMethod` can only be used for a single transaction.
        customer_id:
          $ref: '#/components/schemas/CustomerIDField'
      required:
      - type
      - reusable
    EBTCard:
      description: An object that details information about the EBT Card.
      type: object
      properties:
        number:
          type: string
          description: 'The EBT Card number minus any separators.

            '
      required:
      - number
    TokenizedPaymentMethod:
      description: 'This object represents a customer''s payment instrument. It has been tokenized by the server. It does not include all details about the payment method.


        If the `PaymentMethod` has a type of `ebt`, then the `balance` field will be `null` until the `/api/payment_methods/{ref}/` endpoint is called. The `balance` field will always be `null` for non-EBT payment methods.

        '
      allOf:
      - type: object
        properties:
          ref:
            type: string
            description: A unique reference identifier for the `PaymentMethod`. The `ref` is constant for a `customer_id` if the card is `reusable`.
          type:
            type: string
            description: 'The card type. One of:


              - `credit`

              - `debit`

              - `prepaid`

              - `ebt`


              ⚠️ The `type` value can only be `credit`, `debit`, or `prepaid` in a [Fully Hosted](https://docs.joinforage.app/docs/fully-hosted) or [HSA/FSA](https://docs.joinforage.app/docs/enable-hsa-fsa-payments) integration.

              '
          reusable:
            type: boolean
            description: Whether the `PaymentMethod` can be reused.  If `false`, then the `PaymentMethod` can only be used for a single transaction.
          card:
            oneOf:
            - $ref: '#/components/schemas/EBTCardResponse'
            - $ref: '#/components/schemas/NonEBTCard'
            - $ref: '#/components/schemas/StripeCard'
          balance:
            $ref: '#/components/schemas/BalanceResponse'
          customer_id:
            $ref: '#/components/schemas/CustomerIDField'
      example:
        ref: ac47392bb1
        type: ebt
        reusable: true
        card:
          last_4: '3456'
          created: 2021-06-16T00:11:50.000000Z-07:00
          token: tok_sandbox_12345678901234567890
          state: CA
          fingerprint: 470dda97b63f016a962de150cf53ad72a93aaea4c2a59de2541e0994f48e02ef
          fingerprint_v2: a2f1b4e6c7d9380b59fa7c2e98ad0e316be9fcde1e2a4c3d56b17c6e0198a2fb
        balance: '100.00'
        customer_id: cus_1234567890
    CustomerIDField:
      type: string
      maxLength: 64
      description: '**⚠️ If you’re integrating Forage with a POS Terminal, then do not use this param. It is only supported for online transactions.**


        A unique identifier for the end customer making the payment.


        Forage automatically adds the `customer_id` to the Session''s corresponding `Order` and `OrderPayments`.


        This field helps Forage''s servers more quickly identify the customer associated with the request. While `customer_id` is not technically required, if you omit it then requests could take longer to process. **It is strongly recommended to pass customer_id.**


        If you''re providing your internal customer ID, then we recommend that you hash the value before sending it on the payload.


        Each customer should only have one unique `customer_id`. For example, if you create both a `PaymentMethod` and a Forage `Session` (Fully Hosted or Custom) or `Payment` (SDK) for the same customer, then the `customer_id` should be the same in both requests to ensure continuity of stored payment methods.

        '
    PaymentMethodUpdateRequest:
      type: object
      description: The `PaymentMethod` details to update.
      properties:
        reusable:
          type: boolean
          description: Whether the `PaymentMethod` can be reused. If `false`, then the `PaymentMethod` can only be used for a single transaction.
        customer_id:
          type: string
          maxLength: 64
          description: 'A unique ID for the end customer associated with the payment method. `customer_id` can only be set once and can''t be changed, so this param only applies if the `PaymentMethod` doesn''t yet include a `customer_id`. If you try to update the `customer_id` field after it has already been set, then the API throws an error.


            **You must build with Forage Version `2023-05-15` or later to use `customer_id`.** Either pass `2023-05-15` as the `API-Version` header on a per request basis, or set the version for all requests in the Forage dashboard.

            '
    PaginatedReportCommonFields:
      properties:
        next:
          type: string
          nullable: true
          description: 'A URL that you can send a `GET` to in order to retrieve the next set of results. Alternatively, you can retrieve the `cursor` value from the URL and pass it in the body of a new request.


            This value is `null` if there are no more results.

            '
        previous:
          type: string
          nullable: true
          description: 'A URL that you can send a `GET` to in order to retrieve the previous set of results. Alternatively, you can retrieve the `cursor` value from the URL and pass it in the body of a new request.


            This value is `null` if the response includes the first set of results.

            '
    OrderAndTaxesReportResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedReportCommonFields'
      - type: object
        properties:
          next:
            example: https://api.sandbox.joinforage.app/reporting/orders/?cursor=cD0yMDIzLTAxLTMxKzIxJTNBMzElM0ExNC40NTUxNjMlMkIwMCUzQTAw&end_date=2021-02-28&start_date=2021-01-31
          previous:
            example: null
          results:
            type: array
            description: An array of objects that detail information about each `Order` during the provided reporting period.
            items:
              type: object
              properties:
                ref:
                  type: string
                  description: A unique reference hash for the Forage `Order` object.
                  example: b085e45a54
                status:
                  type: string
                  description: 'The status of the order in the Forage lifecycle. One of:


                    - `canceled`

                    - `draft`

                    - `failed`

                    - `processing`

                    - `succeeded`

                    '
                  enum:
                  - canceled
                  - draft
                  - failed
                  - processing
                  - succeeded
                  example: draft
                snap_eligible_total:
                  type: string
                  format: decimal
                  description: The SNAP-only eligible portion of the order cost in USD.
                  example: '25.99'
                ebt_cash_eligible_total:
                  type: string
                  format: decimal
                  description: The EBT Cash-only eligible portion of the order cost in USD.
                  example: '21.23'
                remaining_total:
                  type: string
                  format: decimal
                  description: The portion of the `Order` total, in USD, that is neither SNAP eligible nor EBT Cash eligible. This amount must be charged to a credit or debit card.
                  example: '44.39'
                sales_tax_applied:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The amount of sales tax that Forage added to the order total, calculated after the customer distributed tender across payment methods.


                    This value is always `0` for Custom integrations. Forage only calculates taxes for Fully Hosted integrations.


                    If the value is nonzero, then some of the `ebt_cash_paid` or `credit_debit_paid` amount covered taxes. Per FNS regulations, `snap_paid` is tax-exempt. The sum of (`snap_paid`, `ebt_cash_paid`, `credit_debit_paid`) should always equal the sum of (`sales_tax_applied`, `snap_eligible_total`, `remaining_total`).


                    _The value of this field is `null` if the `status` of the `Order` is not `succeeded` or `failed`_.

                    '
                  example: '5.12'
                snap_paid:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The portion of the order cost in USD that the customer paid for with SNAP benefits.


                    _The value of this field is `null` if the `status` of the `Order` is not `succeeded` or `failed`_.

                    '
                  example: '86.29'
                ebt_cash_paid:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The portion of the order cost in USD that the customer paid for with EBT Cash benefits.


                    _The value of this field is `null` if the `status` of the `Order` is not `succeeded` or `failed`_.

                    '
                  example: '15.22'
                credit_debit_paid:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The portion of the order cost in USD that the customer paid for with credit/debit card.


                    _The value of this field is `null` if the `status` of the `Order` is not `succeeded` or `failed`_.

                    '
                  example: '67.90'
                merchant_fns_number:
                  type: string
                  description: The FNS number of the merchant that created this order.
                  example: '1234567'
                created:
                  type: string
                  format: date-time
                  description: A UTC timestamp of when the `Order` was created, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string.
                  example: '2021-06-15T00:11:50.000000Z'
                success_date:
                  type: string
                  format: date-time
                  description: A UTC timestamp of when all `OrderPayments` associated with the `Order` were successfully processed, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string.
                  example: '2021-06-16T00:11:50.000000Z'
                payments:
                  type: array
                  description: An array of the unique reference hashes for any Forage `OrderPayments` associated with the `Order`.
                  example:
                  - cd62e45f33
                  - a2f4e45665
                  items:
                    type: string
                refunds:
                  type: array
                  description: An array of the unique reference hashes for any Forage `OrderRefunds` associated with the `Order`.
                  example:
                  - aaabe45432
                  - 7e84e45db7
                  items:
                    type: string
                psp_customer_id:
                  type: string
                  nullable: true
                  description: 'The third-party credit/debit payment processor’s unique identifier for the customer.


                    _The value of this field is null if the `Order` was created via a POST to `/capture_sessions/`_


                    **You must build with Forage Version `2023-05-15` or later to use `psp_customer_id`.** Either pass `2023-05-15` as the `API-Version` header on a per request basis, or set the version for all requests in the Forage dashboard.

                    '
                external_order_id:
                  $ref: '#/components/schemas/ExternalOrderIDField'
                external_location_id:
                  $ref: '#/components/schemas/ExternalLocationIDField'
            required:
            - ref
            - status
            - snap_eligible_total
            - ebt_cash_eligible_total
            - remaining_total
            - sales_tax_applied
            - snap_paid
            - ebt_cash_paid
            - credit_debit_paid
            - merchant_fns_number
            - created
            - payments
            - refunds
            - psp_customer_id
    ExternalOrderIDField:
      type: string
      maxLength: 64
      description: 'A unique identifier for the order as created by the merchant or platform (not Forage).


        When a merchant or platform passes this order ID to Forage, it persists in each Forage transaction related to the `Order`. This field enables merchants to map order IDs in their system to corresponding Forage `Order` IDs.


        **You must build with Forage Version `2023-05-15` or later to use `external_order_id`.** Either pass `2023-05-15` as the `API-Version` header on a per request basis, or set the version for all requests in the Forage dashboard.

        '
    ExternalLocationIDField:
      type: string
      description: 'A unique identifier, provided by the merchant or platform (not Forage), that indicates the physical fulfillment location for the order. For example, this field could specify which location of a grocery store chain fulfilled an order.

        '
      example: 6e3b2ff7-51c8-4c64-befa-2eac90f7c3e9
    PayoutReportResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedReportCommonFields'
      - type: object
        properties:
          next:
            example: https://api.sandbox.joinforage.app/reporting/payouts/?cursor=cD0yMDIzLTAxLTMxKzIxJTNBMzElM0ExNC40NTUxNjMlMkIwMCUzQTAw&end_date=2021-02-28&start_date=2021-01-31
          previous:
            example: null
          results:
            type: array
            items:
              type: object
              properties:
                payout_id:
                  type: string
                  description: 'A unique identifier for the payout that this transaction is associated with.

                    '
                  example: f73a3abc01
                merchant_id:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash identifying the merchant associated with this transaction. Blank if the settlement reflects a platform instead of a merchant payout.

                    '
                  example: gxe37pc24y
                fns_id:
                  type: string
                  nullable: true
                  description: The FNS number of the merchant. Blank if the settlement reflects a platform instead of a merchant payout.
                  example: '1234567'
                payout_issued_date:
                  type: string
                  format: date
                  nullable: true
                  description: A timestamp of when the payout was created.
                expected_deposit_date:
                  type: string
                  format: date
                  nullable: true
                  description: A timestamp of when Forage expects the payout to be deposited. This is typically the payout_issued_date plus one business day, if the ACH method is next-day.
                total_purchases:
                  type: string
                  format: decimal
                  description: The total amount in USD of all of the purchases included in this payout.
                  example: '99.99'
                total_refunds:
                  type: string
                  format: decimal
                  description: The total amount in USD of all of the refunds included in this payout.
                  example: '15.11'
                total_void_purchases:
                  type: string
                  format: decimal
                  description: The total amount in USD refunded to customers due to a voided purchase initiated by Forage or the server.
                  example: '1.12'
                total_void_refunds:
                  type: string
                  format: decimal
                  description: The total amount in USD debited from customers due to a voided refund initiated by Forage or the server.
                  example: '0.22'
                total_chargebacks:
                  type: string
                  format: decimal
                  description: The total amount in USD of refunds paid to customers as the result of dispute resolutions during this payout period. The `total_chargebacks` value is distinct and not included in the `total_refunds` value.
                  example: '0.00'
                forage_fee:
                  type: string
                  format: decimal
                  description: The amount of Forage fees applied to the transaction
                  example: '2.31'
                total_positive_adjustments:
                  type: string
                  format: decimal
                  description: 'If any, the total arbitrary amount in USD that has been added to the settlement.

                    For example, this could happen in the rare case that Forage corrects a previous settlement.

                    '
                total_negative_adjustments:
                  type: string
                  format: decimal
                  description: 'If any, the total arbitrary amount in USD that has been deducted from the settlement.


                    For example, this could happen in the rare case that Forage corrects a previous settlement.

                    '
                merchant_net_settlement:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The net amount sent to the merchant, equal to the sum of purchases minus refunds, chargebacks, fees, and any other deductions.


                    This value is `null` if the settlement reflects a platform instead of a merchant payout.

                    '
                  example: '21.29'
                platform_net_settlement:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The net amount sent to the platform, if applicable, equal to the sum of purchases minus refunds, chargebacks, fees, and any other deductions.


                    This value is `null` if the settlement reflects a merchant payout and no platform was involved.

                    '
                  example: '2.37'
                merchant_destination_account_ref:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash for the merchant''s destination bank account. `null` if settled to a platform account.

                    '
                  example: c45b20e98a
    PayoutTransactionReportResponse:
      allOf:
      - $ref: '#/components/schemas/PaginatedReportCommonFields'
      - type: object
        properties:
          next:
            example: https://api.sandbox.joinforage.app/reporting/payouts/{payout_id}/transactions/?cursor=cD0yMDIzLTAxLTMxKzIxJTNBMzElM0ExNC40NTUxNjMlMkIwMCUzQTAw&end_date=2021-02-28&start_date=2021-01-31
          previous:
            example: null
          results:
            type: array
            items:
              type: object
              properties:
                merchant_id:
                  type: string
                  description: 'A 10-character unique hash identifying the merchant associated with this transaction. Blank if the settlement reflects a platform instead of a merchant payout.

                    '
                  example: gxe37pc24y
                merchant_group_id:
                  type: string
                  nullable: true
                  description: The unique identifier of the merchant group associated with this transaction, provided by Forage.
                  example: 3hsk173gs8
                corporation_id:
                  type: string
                  nullable: true
                  description: The unique identifier of the corporation associated with this transaction, provided by Forage.
                  example: 6sjqk816dj
                fns_id:
                  type: string
                  description: The FNS number of the merchant that received the payout including this transaction. Blank if the settlement reflects a platform instead of a merchant payout.
                  example: '1234567'
                recorded_date:
                  type: string
                  format: date-time
                  description: The date and time of the transaction, formatted as an [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) string in the UTC timezone.
                  example: '2024-11-04T14:00:00Z'
                payout_issued_date:
                  type: string
                  format: date
                  nullable: true
                  description: The timestamp of when the payout was created. (Value only populated for Payout Transaction Reports)
                expected_deposit_date:
                  type: string
                  format: date
                  nullable: true
                  description: 'The timestamp of when Forage expects the payout to be deposited. This is typically the payout_issued_date plus one business day, if the ACH method is next-day.

                    (Value only populated for Payout Transaction Reports)

                    '
                transaction_type:
                  type: string
                  description: 'The type of the transaction. Must be one of the following:


                    - `Purchase`

                    - `Purchase_With_Cash_Back`

                    - `Refund`

                    - `Withdrawal`

                    - `Chargeback`

                    - `Void_Purchase`

                    - `Void_Refund`

                    - `Negative_adjustment`

                    - `Positive_adjustment`

                    - `Balance_Inquiry_Fee`

                    - `Refund_Processing_Fee`


                    See our [Transaction types guide](https://docs.joinforage.app/docs/transaction-type-and-payment-method#transaction-types) for details on credit/debit flow.

                    '
                  example: Purchase
                payment_method:
                  type: string
                  description: 'The payment method used for the transaction. Must be one of the following:


                    - `SNAP`

                    - `EBT_Cash`

                    - `Credit_Debit`

                    - `Payfac_Credit_Debit`

                    - `HSA`

                    - `FSA`


                    If the `transaction_type` is one of the following, `payment_method` will be `""`:


                    - `Positive_adjustment`

                    - `Negative_adjustment`

                    - `Balance_Inquiry_Fee`

                    - `Refund_Processing_Fee`


                    _Note:_ `Credit_Debit` and `Payfac_Credit_Debit` are only applicable for transactions in Fully Hosted integrations.

                    '
                  example: SNAP
                transaction_amount:
                  type: string
                  format: decimal
                  nullable: true
                  description: The total amount in USD charged, voided, or refunded to the customer.
                  example: '24.15'
                forage_fee:
                  type: string
                  format: decimal
                  nullable: true
                  description: The amount of Forage fees applied to the transaction.
                  example: '0.34'
                merchant_net_settlement:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The net amount sent to the merchant, equal to the sum of purchases minus refunds, chargebacks, fees, and any other deductions.


                    This value is `null` if the settlement reflects a platform instead of a merchant payout.

                    '
                  example: '21.29'
                platform_net_settlement:
                  type: string
                  format: decimal
                  nullable: true
                  description: 'The net amount sent to the platform, if applicable, equal to the sum of purchases minus refunds, chargebacks, fees, and any other deductions.


                    This value is `null` if the settlement reflects a merchant payout and no platform was involved.

                    '
                  example: '2.37'
                order_id:
                  type: string
                  description: 'A 10-character unique hash identifying the order for Fully Hosted and Custom integrations. Blank for SDK integrations.

                    '
                  example: a9a7226jm8
                external_order_id:
                  type: string
                  nullable: true
                  description: 'The unique identifier of the order as created by the merchant or platform (not Forage). This typically corresponds to an identifier in the merchant or platform''s database,

                    so it can be used as a reference to look up the transaction.

                    '
                  example: abc123456
                payment_id:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash identifying the related `Payment` or `OrderPayment`.

                    '
                  example: mn0yo1orjw
                refund_id:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash identifying the related `Refund` or `OrderRefund`.

                    '
                  example: 56us47lbpo
                chargeback_id:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash identifying the chargeback transaction. Present only when `transaction_type` is `Chargeback`.

                    '
                  example: luw8sozitr
                merchant_payout_id:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash identifying the merchant payout. Present only in Payout Transaction Reports.

                    '
                  example: jakqbi64tv
                platform_payout_id:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash identifying the platform payout. Present only if the transaction is part of a platform payout, and only in Payout Transaction Reports.

                    '
                  example: atn1ulwziv
                merchant_destination_account_ref:
                  type: string
                  nullable: true
                  description: 'A 10-character unique hash for the merchant''s destination bank account. `null` if settled to a platform account.

                    '
                  example: c45b20e98a
                external_location_id:
                  $ref: '#/components/schemas/ExternalLocationIDField'
                description:
                  type: string
                  description: A description of the transaction, as provided by the merchant or platform when the transaction was created.
            required:
            - merchant_id
            - fns_id
            - merchant_group_id
            - corporation_id
            - recorded_date
            - payout_issued_date
            - expected_deposit_date
            - transaction_type
            - payment_method
            - transaction_amount
            - forage_fee
            - merchant_net_settlement
            - platform_net_settlement
            - order_id
            - external_order_id
            - refund_id
            - chargeback_id
            - merchant_payout_id
            - platform_payout_id
            - merchant_destination_account_ref
            - description
