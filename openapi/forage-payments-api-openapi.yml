          ebt_payment_method:
            type: string
            description: 'A unique reference hash for an existing Forage [`PaymentMethod`](https://docs.joinforage.app/reference/payment-methods). Use this param if you''d like to pre-populate the payment method field in the checkout UI for a returning customer.


              _This field is only returned in the response if it is passed in the original request body_.

              '
            example: ac47392bb1
        required:
        - product_list
      example:
        delivery_address:
          city: San Francisco
          country: US
          line1: 1856 Market St.
          state: CA
          zipcode: '94102'
        is_delivery: false
        payment_details:
          snap_payment:
            amount: 20.12
            metadata: {}
            payment_method: fsdf45345
            description: A SNAP payment
            funding_type: ebt_snap
          ebt_cash_payment:
            amount: 25.99
            metadata: {}
            payment_method: fsdf45345
            description: An EBT Cash payment
            funding_type: ebt_cash
        remaining_total: '5.99'
        product_list:
        - name: Apple
          upc: 033383087375
          unit_price: 2.99
          quantity: 5
          tax_rate: 0.015
          tax_rate_list:
          - imposed_by: California State Tax
            tax_rate: 0.015
          eligibility: snap
        success_redirect_url: https://www.your-app.com/?status=SUCCEEDED
        cancel_redirect_url: https://www.your-app.com/?status=CANCELED
    ProductData:
      type: object
      required:
      - name
      - unit_price
      description: Product information for an item in a customer's cart.
      properties:
        name:
          type: string
          description: The name of the product.
        upc:
          type: string
          description: The UPC of the product.
        gtin:
          type: string
          description: The GTIN (Global Trade Item Number) of the product.
        unit_price:
          type: number
          format: currency
          description: The unit price of the product.
        quantity:
          type: number
          format: integer
          description: The quantity of the product.
        tax_rate:
          type: number
          format: decimal
          description: The tax rate for the product, represented as a decimal with at most six decimal places. A value of `0` indicates a tax rate of 0%, and a value of `1` indicates a tax rate of 100%. To set a 2% tax rate, for example, set the value to `0.02`. Use this field if the product is subject to only one tax rate. If multiple tax rates apply, for example both a state grocery tax and a sweetened beverage tax, then use the `tax_rate_list` param instead of `tax_rate`.
        tax_rate_list:
          type: array
          items:
            type: object
            required:
            - imposed_by
            - tax_rate
            properties:
              imposed_by:
                type: string
                description: The entity applying the tax to this item.
              tax_rate:
                type: number
                format: decimal
                description: The tax rate applied to the item by the entity described in the `imposed_by` field. If the product is subject to only one tax rate, then use the single `tax_rate` param instead of `tax_rate_list`.
              taxes_charged:
                type: number
                format: currency
                description: The portion of taxes charged for this item attributable to the `imposed_by` entity.
              taxes_exempted:
                type: number
                format: currency
                description: The portion of taxes exempted for this item attributable to the `imposed_by` entity.
        taxes_charged:
          type: number
          format: currency
          description: The amount of taxes charged for this item in USD.
        taxes_exempted:
          type: number
          format: currency
          description: The amount of taxes exempted for this item in USD.
        tax_total:
          type: number
          format: currency
          description: The total tax for this item in USD.
        eligibility:
          type: string
          description: The eligibility of the product. Must be `snap`, `ebt_cash`, or `non_ebt`.
          enum:
          - snap
          - ebt_cash
          - non_ebt
    ProductDataResponse:
      type: object
      required:
      - id
      - name
      - upc
      - unit_price
      - quantity
      - eligibility
      - snap_amount
      - cash_amount
      - credit_debit_amount
      - tax_collected
      - taxes_charged
      - taxes_exempted
      properties:
        id:
          type: integer
          description: The unique identifier for the product.
        name:
          type: string
          description: The name of the product.
        upc:
          type: string
          nullable: true
          description: The UPC of the product.
        gtin:
          type: string
          description: The GTIN (Global Trade Item Number) of the product.
        unit_price:
          type: string
          format: currency
          description: The unit price of the product, represented as a numeric string.
        quantity:
          type: integer
          description: The quantity of the product.
        tax_rate:
          type: string
          format: decimal
          description: The tax rate for the product, represented as a decimal string with at most six decimal places. A value of `0` indicates a tax rate of 0%, and a value of `1` indicates a tax rate of 100%. To set a 2% tax rate, for example, set the value to `0.02`. Use this field if the product is subject to only one tax rate. If multiple tax rates apply, for example both a state grocery tax and a sweetened beverage tax, then use the `tax_rate_list` param instead of `tax_rate`.
        tax_rate_list:
          type: array
          items:
            type: object
            required:
            - imposed_by
            - tax_rate
            properties:
              imposed_by:
                type: string
                description: The entity applying the tax to this item.
              tax_rate:
                type: string
                format: decimal
                description: The tax rate applied to the item by the entity described in the `imposed_by` field, represented as a decimal string. If the product is subject to only one tax rate, then use the single `tax_rate` param instead of `tax_rate_list`.
              taxes_charged:
                type: string
                format: currency
                nullable: true
                description: The portion of taxes charged for this item attributable to the `imposed_by` entity, represented as a numeric string.
              taxes_exempted:
                type: string
                format: currency
                nullable: true
                description: The portion of taxes exempted for this item attributable to the `imposed_by` entity, represented as a numeric string.
        eligibility:
          type: string
          nullable: true
          enum:
          - snap
          - ebt_cash
          - non_ebt
          description: The eligibility of the product. Must be `snap`, `ebt_cash`, or `non_ebt`.
        snap_amount:
          type: string
          format: currency
          nullable: true
          description: The amount paid for this product using SNAP benefits in USD, represented as a numeric string. Precision is supported to the penny.
        cash_amount:
          type: string
          format: currency
          nullable: true
          description: The amount paid for this product using EBT Cash benefits in USD, represented as a numeric string. Precision is supported to the penny.
        credit_debit_amount:
          type: string
          format: currency
          nullable: true
          description: The amount paid for this product using credit or debit card in USD, represented as a numeric string. Precision is supported to the penny.
        tax_collected:
          type: string
          format: currency
          nullable: true
          description: The tax amount collected for this product in USD, represented as a numeric string. Precision is supported to the penny.
        taxes_charged:
          type: string
          format: currency
          nullable: true
          description: The amount of taxes charged for this product in USD, represented as a numeric string. Precision is supported to the penny.
          example: '2.47'
        taxes_exempted:
          type: string
          format: currency
          nullable: true
          description: The amount of taxes exempted for this product in USD, represented as a numeric string. Precision is supported to the penny.
          example: '1.83'
    OrderResponse:
      type: object
      required:
      - ref
      - snap_total
      - ebt_cash_total
      - delivery_address
      - is_delivery
      - success_redirect_url
      - cancel_redirect_url
      - supported_benefits
      - psp_customer_id
      - customer_id
      - external_order_id
      - external_location_id
      - status
      - payments
      - refunds
      - success_date
      - receipt
      - expires_at
      - is_commercial_shipping
      - previous_errors
      properties:
        ref:
          type: string
          description: A unique reference hash for the Forage `Order` object.
          example: 93410bcaff
        snap_total:
          type: string
          format: currency
          description: The SNAP eligible portion of the order cost in USD, represented as a numeric string. Precision is supported to the penny.
          example: '25.99'
        ebt_cash_total:
          type: string
          format: currency
          description: The portion of the `Order` total, in USD, that is EBT Cash eligible only, represented as a numeric string. Precision is supported to the penny.
          example: '5.99'
        remaining_total:
          type: string
          format: currency
          description: The portion of the `Order` total, in USD, that is neither SNAP eligible nor EBT Cash eligible, represented as a numeric string. This amount must be charged to a credit or debit card, with precision supported to the penny. _This value is returned only for [Fully Hosted Sessions](https://docs.joinforage.app/reference/forage-sessions#fully-hosted-session) and is not included if the `Order` was created using a POST request to [`/capture_sessions/`](https://docs.joinforage.app/reference/create-capture-session)._
          example: '10.99'
        product_list:
          type: array
          items:
            $ref: '#/components/schemas/ProductDataResponse'
          description: A list of the products in the customer's cart. If there are no taxes applied to any of the products, then this field can be empty. _This value is only returned for [Fully Hosted Sessions](https://docs.joinforage.app/reference/forage-sessions#fully-hosted-session). It is not returned if the `Order` was created via a POST to [`/capture_sessions/`](https://docs.joinforage.app/reference/create-capture-session)._
          example: []
        platform_fee:
          type: string
          format: decimal
          description: An optional field, for use by a platform supporting multiple merchants, that indicates the percentage cut of each payment that the platform charges as a fee. Represented as a decimal string.
          example: '0.05'
        delivery_address:
          $ref: '#/components/schemas/DeliveryAddressData'
        is_delivery:
          type: boolean
          description: Whether the order is for delivery or pickup. This information is required per FNS regulations. Defaults to `false` if not provided.
          example: true
        success_redirect_url:
          type: string
          description: The URL to redirect your customer to if the order is completed successfully, passed in the original request to create a `Session`.
          example: https://www.your-app.com/?status=SUCCEEDED
        cancel_redirect_url:
          type: string
          description: The URL to redirect your customer to if they cancel the order, passed in the original request to create a `Session`.
          example: https://www.your-app.com/?status=CANCELED
        supported_benefits:
          type: array
          items:
            type: string
          description: 'A list that limits the types of payment methods that can be applied at checkout, including any or all of the values in: `["snap", "ebt_cash", "non_ebt"]`. Use `supported_benefits` **only** if you want to restrict the possible payment method types. Omit this field in all other cases. For example, pass `["snap", "non_ebt"]` if you want to accept SNAP and credit card payments only (excluding EBT Cash).

            '
          example:
          - snap
          - non_ebt
        psp_customer_id:
          type: string
          nullable: true
          description: 'The third-party credit/debit payment processor''s unique identifier for the customer. _This value is returned as `null` if the `Order` was created via a POST to [`/capture_sessions/`](https://docs.joinforage.app/reference/create-capture-session)._


            **You must build with Forage Version `2023-05-15` or later to use `psp_customer_id`.** Either pass `2023-05-15` as the `API-Version` header on a per request basis, or set the version for all requests in the Forage dashboard.

            '
          example: cus_AJ6yA7mRH34mJT
        customer_id:
          allOf:
          - $ref: '#/components/schemas/CustomerIDField'
          nullable: true
          example: my_user_id
        external_order_id:
          allOf:
          - $ref: '#/components/schemas/ExternalOrderIDField'
          nullable: true
        external_location_id:
          type: string
          nullable: true
          description: A unique identifier for the physical fulfillment location.
        status:
          type: string
          description: 'The status of the `Order` in the Forage lifecycle. One of:


            - `canceled`

            - `draft` (the status at the start, when a Session is created)

            - `failed`

            - `processing`

            - `succeeded`


            If the value is `failed`, then [inspect the associated Order Payments](https://docs.joinforage.app/reference/get-all-order-payments) to determine the cause of the error.

            '
          enum:
          - draft
          - processing
          - failed
          - succeeded
          - canceled
          example: draft
        payments:
          type: array
          description: An array of the unique reference hashes for any Forage `OrderPayment` objects associated with the `Order`.
          items:
            type: string
            description: Payment ref
          example: []
        refunds:
          type: array
          description: An array of the unique reference hashes for any Forage `OrderRefund` objects associated with the `Order`.
          items:
            type: string
            description: Refund ref
          example: []
        success_date:
          type: string
          nullable: true
          format: date-time
          description: A UTC timestamp of the date when the `Order` was successfully charged. This value is `null` if the `status` of the `Order` is not yet `succeeded`.
          example: '2021-06-16T00:11:50.000000Z'
        receipt:
          nullable: true
          description: 'Most of the information that you''re required to display to the customer, according to FNS regulations.


            This field is `null` if the data that populates the receipt is not yet available.


            The total amount paid by the customer is `snap_amount` + `ebt_cash_amount` + `other_amount`. This amount will be settled with the merchant after applying Forage''s fees.

            '
          allOf:
          - $ref: '#/components/schemas/ReceiptData'
        expires_at:
          type: string
          nullable: true
          format: date-time
          description: 'A UTC timestamp of when the `Order` will expire if it is not captured or canceled, set to 30 minutes from when the `Order` is created.


            If the `status` of the `Order` is `succeeded` or `canceled`, then the `expires_at` value is `null`.

            '
          example: '2021-06-16T00:41:50.000000Z'
        is_commercial_shipping:
          type: boolean
          nullable: true
          description: Whether the order is to be shipped commercially. FNS uses this value in its database for statistics.
        previous_errors:
          $ref: '#/components/schemas/ErrorsArray'
    OrderUpdateRequest:
      type: object
      description: 'This object updates an order.

        '
      properties:
        product_list:
          type: array
          items:
            $ref: '#/components/schemas/ProductData'
          description: 'A list of products that a customer has in their cart at checkout. If there are no taxes applied to any of the products, this field can be empty.

            _This field can only be updated for an `Order` that is the outcome of a Fully Hosted Session. The `product_list` is `null` in the case of an `Order` created via a Custom Payment Capture Session_.

            '
        platform_fee:
          type: number
          format: decimal
          description: An optional field, for use by a platform supporting multiple merchants, that indicates the percentage cut of each payment that the platform charges as a fee.
        delivery_address:
          $ref: '#/components/schemas/DeliveryAddressData'
        is_delivery:
          type: boolean
          description: Whether the order is for delivery or pickup. This information is required per FNS regulations. Defaults to `false` if not provided.
        success_redirect_url:
          type: string
          description: The URL to redirect your customer to if the `Order` is completed successfully.
        cancel_redirect_url:
          type: string
          description: The URL to redirect your customer to if the order is canceled.
        supported_benefits:
          type: array
          items:
            type: string
          description: 'A list that limits the types of payment methods that can be applied at checkout, including any or all of the values in: `["snap", "ebt_cash", "non_ebt"]`. Use `supported_benefits` **only** if you want to restrict the possible payment method types. Omit this field in all other cases. For example, pass `["snap", "non_ebt"]` if you want to accept SNAP and credit card payments only (excluding EBT Cash).

            '
        psp_customer_id:
          type: string
          description: 'The third-party payment processor''s unique identifier for the customer. An optional field passed in anticipation of a customer applying a credit/debit card to an `Order` balance.


            **You must build with Forage Version `2023-05-15` or later to use `psp_customer_id`.** Either pass `2023-05-15` as the `API-Version` header on a per request basis, or set the version for all requests in the Forage dashboard.

            '
        customer_id:
          $ref: '#/components/schemas/CustomerIDField'
        external_order_id:
          $ref: '#/components/schemas/ExternalOrderIDField'
        is_commercial_shipping:
          type: boolean
          description: Whether the order is to be shipped commercially. FNS uses this value in its database for statistics.
        external_location_id:
          $ref: '#/components/schemas/ExternalLocationIDField'
    OrderPaymentRequest:
      type: object
      description: This object represents a one-time payment, charged to a single payment method, associated with a specific Forage Order.
      properties:
        funding_type:
          type: string
          description: 'A string that represents the type of tender. One of:


            - `benefit`

            - `credit_tpp`

            - `ebt_cash`

            - `ebt_snap`

            '
          enum:
          - benefit
          - credit_payfac
          - credit_tpp
          - ebt_cash
          - ebt_snap
          - wic
          default: ebt_snap
        amount:
          type: string
          format: decimal
          description: 'A positive decimal number that represents how much to charge the `PaymentMethod` in USD. Precision is supported to the penny.


            This value must match the `ebt_cash_total` or `snap_total` value that was passed in the request that [created the Custom Capture Session](https://docs.joinforage.app/reference/create-capture-session), depending on the `funding_type`.


            If you need to charge both funding types, then create an `OrderPayment` for each charge, using the same `order_ref` returned when the order''s parent [Payment Capture Session was created](https://docs.joinforage.app/reference/create-capture-session).


            The minimum amount that can be charged is `0.01`.

            '
          example: '25.99'
        description:
          type: string
          description: A string that describes the `OrderPayment`.
          default: An EBT payment
        metadata:
          allOf:
          - $ref: '#/components/schemas/MetadataObject'
          - default: {}
        payment_method:
          type: string
          description: The unique reference hash for the existing Forage [`PaymentMethod`](https://docs.joinforage.app/reference/payment-methods) that is to be charged in this transaction.
          default: b16673fe21
        customer_id:
          $ref: '#/components/schemas/CustomerIDField'
        external_order_id:
          $ref: '#/components/schemas/ExternalOrderIDField'
        merchant_fixed_settlement:
          type: string
          format: decimal
          nullable: true
          description: 'The fixed amount in USD that should be restored to the merchant from EBT Cash payments prior to splitting by the `platform_fee`. Precision is supported to the penny.

            '
          example: '5.11'
        platform_fixed_settlement:
          type: string
          format: decimal
          nullable: true
          description: 'The fixed amount in USD that should be restored to the platform from EBT Cash payments prior to splitting by the `platform_fee`. Precision is supported to the penny.

            '
          example: '5.11'
        external_location_id:
          $ref: '#/components/schemas/ExternalLocationIDField'
      required:
      - funding_type
      - amount
      - description
      - metadata
      - payment_method
    OrderPaymentResponse:
      allOf:
      - $ref: '#/components/schemas/OrderPaymentRequest'
      - type: object
        properties:
          ref:
            type: string
            description: 'A unique reference hash for the Forage `OrderPayment` object.


              _Note:_ `receipt.ref_number` equals `ref`.

              '
            example: cc3175bfea
          status:
            type: string
            description: 'The status of the `OrderPayment`. One of:


              - `authorized`: The `OrderPayment` has been authorized, but not yet captured. Only applicable to HSA/FSA payments, which use an authorize-then-capture flow.

              - `canceled`: The `OrderPayment` object can''t be used.

              - `failed`: If the error is temporary, then this `OrderPayment` can be resubmitted for capture without modification. Check the `receipt.message` field for a description of the error.

              - `processing`: The outcome of the `OrderPayment` is pending.

              - `requires_confirmation`: The `OrderPayment` hasn''t been submitted for processing.

              - `succeeded`: The `OrderPayment` has been successfully processed and will be included in settlement. It can''t be changed.

              '
            enum:
            - authorized
            - canceled
            - failed
            - processing
            - requires_confirmation
            - succeeded
            example: requires_confirmation
          last_processing_error:
            type: object
            nullable: true
            description: The code and message values corresponding to the most recent [Payments API error](https://docs.joinforage.app/reference/errors#payments-api-errors).
            properties:
              code:
                type: string
              message:
                type: string
          created:
            type: string
            format: date-time
            description: A UTC timestamp, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string, of when the `OrderPayment` was created.
            example: '2021-06-16T00:11:50.000000Z'
          updated:
            type: string
            format: date-time
            description: A UTC timestamp, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string, of when the `OrderPayment` was last modified.
            example: '2021-06-16T00:11:50.000000Z'
          success_date:
            type: string
            format: date-time
            nullable: true
            description: A UTC timestamp, represented as an [ISO 8601 date-time](https://www.iso.org/iso-8601-date-and-time-format.html) string, of when the `status` of the `OrderPayment` is `succeeded`. This value is always `null` when the `OrderPayment` is first created.
            example: '2021-06-16T00:11:50.000000Z'
          tpp_lookup_id:
            type: string
            nullable: true
            description: 'This value is always null for `OrderPayments` resulting from Custom Sessions. It’s most relevant to Fully Hosted Sessions, which process credit/debit payments.


              A value that merchants can use to associate this payment with a credit/debit payment processed by a third party processor.


              For Stripe integrations, this is the client secret for a [`PaymentIntent`](https://stripe.com/docs/api/payment_intents).

              '
            example: pi_1DpdZq2eZvKYlo2CAYyzTr8j_secret_lxr4crBJP4txbrg7sqit0XQQO
          order:
            type: string
            description: A unique reference hash for the parent `Order`, as passed in the request to create the `OrderPayment`.
            example: 340129aff3
          merchant:
            type: string
            description: The FNS (Food and Nutrition Service) number of the merchant associated with this `OrderPayment`.
          amount:
            type: string
            format: decimal
            nullable: true
            description: The amount charged to the payment method, in USD. Null until the payment is captured.
          merchant_fixed_settlement:
            type: string
            format: decimal
            nullable: true
            description: The fixed amount in USD restored to the merchant from EBT Cash payments before the `platform_fee` split. Null when not set.
          platform_fixed_settlement:
            type: string
            format: decimal
            nullable: true
            description: The fixed amount in USD the platform takes from EBT Cash payments before the `platform_fee` split. Null when not set.
          external_location_id:
            nullable: true
            description: A unique identifier, provided by the merchant or platform (not Forage), that indicates the physical fulfillment location for the order. Null when not provided.
        required:
        - ref
        - order
        - merchant
        - status
        - created
        - updated
    PaymentRequest:
      type: object
      description: This object represents a single payment. It is associated with a single payment method.
      properties:
        amount:
          type: string
          format: decimal
          description: A positive decimal number that represents how much to charge the [`PaymentMethod`](https://docs.joinforage.app/reference/payment-methods) in USD. Precision is supported to the penny. The minimum amount that can be charged is `0.01`. To differentiate between a SNAP and an EBT Cash charge on the same EBT Card, use the `funding_type` field. If you need to charge both funding types, then create a `Payment` for each charge.
        funding_type:
          type: string
          description: The payment instrument type. Use this field to differentiate between a SNAP (`ebt_snap`) and an EBT Cash (`ebt_cash`) charge on the same EBT Card. If you need to charge both funding types, then create a `Payment` for each charge. Use `credit_payfac` for all charges to HSA/FSA cards. `credit_tpp` is the funding type assigned to non-EBT payment objects created via a Fully Hosted Checkout integration.
          enum:
          - ebt_snap
          - ebt_cash
          - credit_tpp
          - credit_payfac
          - benefit
          - wic
        payment_method:
          type: string
          description: 'The unique reference hash for the existing Forage [`PaymentMethod`](https://docs.joinforage.app/reference/payment-methods) that is to be charged in this transaction.


            ⚠️ **Exception**: POS integrations do not need to provide a `payment_method` when creating a payment.

            '
        delivery_address:
          $ref: '#/components/schemas/DeliveryAddressData'
        is_delivery:
          type: boolean
          description: '⚠️ **Exception**: If the purchase is made in-store via a POS Terminal, then a `is_delivery` is not required when creating a `Payment`.


            Whether the order is for delivery or pickup. This information is required per FNS regulations. Defaults to `false` if not provided.

            '
        description:
          type: string
          description: A description of the payment.
        metadata:
          $ref: '#/components/schemas/MetadataObject'
        platform_fee:
          type: string
          format: decimal
          description: An optional field, for use by a platform supporting multiple merchants, that indicates the percentage cut of each payment that the platform charges as a fee.
        platform_fixed_settlement:
          type: string
          format: decimal
          description: The fixed amount in USD that a platform takes from EBT Cash payments prior to splitting by the `platform_fee`. Precision is supported to the penny.
        merchant_fixed_settlement:
          type: string
          format: decimal
          description: The fixed amount in USD that should be restored to the merchant from EBT Cash payments prior to splitting by the `platform_fee`. Precision is supported to the penny.
        tpp_lookup_id:
          type: string
          description: 'An identifier for the credit/debit TPP.


            For Stripe integrations, the client secret for a Stripe `PaymentIntent`.

            '
          example: pi_1DpdZq2eZvKYlo2CAYyzTr8j_secret_lxr4crBJP4txbrg7sqit0XQQO
        customer_id:
