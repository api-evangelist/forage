  /api/session_token/:
    parameters:
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    post:
      tags:
      - Bearer Tokens
      summary: Create a session token
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/session_token/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"customer_id\": \"cus_1234567890\"\n}\n'\n"
      description: '> 📘 Authentication Guide

        >

        > For comprehensive details about authenticating with the Forage API, refer to the [authentication guide](https://docs.joinforage.app/docs/authentication).


        > 📘 Session Token Length

        >

        > Session tokens are short-lived and expire after fifteen minutes.



        > ⚠️ Authentication Token Required

        >

        > You need to create an [authentication token](https://docs.joinforage.app/reference/create-authentication-token) before you can generate a session token.



        A `POST` request to `/session_token/` creates a new session token. The token is returned as the `token` value in the response body.



        A session token is a temporary OAuth 2.0 bearer token that expires after 15 minutes.



        Session tokens are used in client-side requests. For example, `POST`s to [create a Payment Method](https://docs.joinforage.app/reference/create-payment-method) require session tokens in the `Authorization` header, and session tokens are passed as parameters to [SDK methods](https://docs.joinforage.app/docs/authentication#sdk-methods-that-require-session-tokens) that submit customer data.



        You can optionally include a `customer_id` in the request body. This should be the same `customer_id` you pass when creating a [PaymentMethod](https://docs.joinforage.app/reference/create-payment-method) for the same customer, so Forage can associate the two.

        '
      security: []
      operationId: forage_oauth:forage_session_token
      requestBody:
        $ref: '#/components/requestBodies/SessionToken'
      responses:
        '201':
          $ref: '#/components/responses/SessionToken201'
        '401':
          description: __Unauthorized__
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/session_token/
                errors:
                - code: invalid_token
                  message: Incorrect authentication credentials.
                  source:
                    resource: OAuth_Access_Tokens
                    ref: ''
  /api/sessions/:
