  /api/payments/{payment_ref}/void/:
    parameters:
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `Payment` object, returned when the [`Payment` was created](https://docs.joinforage.app/reference/create-a-payment).
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/BearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    post:
      tags:
      - Payments
      summary: Void a Payment
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/payments/cc3175bfea/void/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json'\n"
      description: '> ⚠️ POS Terminal and HSA/FSA Payments Only

        >

        > This endpoint is only relevant to Forage EBT POS Terminal integrations and HSA/FSA payments.


        > 📘 For EBT Prefer Refunds Over Voids

        >

        > In most cases, instead of voiding an EBT `Payment`, create a `PaymentRefund`.

        >

        > For EBT `PaymentRefunds` and voided `Payments` have the same impact on settlement, but refunds provide a better paper trail. The refunds API also gives you more granular control over, for example, the fraction of the original `Payment` to refund.


        A `POST` request to `/payments/{payment_ref}/void/` voids the payment transaction.


        On success, this endpoint reverses the impacts of the payment on daily net settlement. The API responds with the original `Payment` object.


        > ⚠️ EBT Balance Value Doesn’t Reflect Voids

        >

        > For EBT payments, the `balance` value in the response does not reflect the voided transaction. The returned `balance` amount accounts for the original transaction, before the void. A customer must check their balance via PIN entry to get the post-void balance.'
      security:
      - OAuth2:
        - internal
        - pinpad_only
      operationId: VoidAPayment(customCheckout)
      responses:
        '200':
          description: Payment was successfully voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_void:
                  summary: Cannot Void
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: cannot_void
                      message: Payment with ref {payment_ref} cannot be voided because it is in the {payment_ref} state. Only payments in the succeeded state can be voided
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter unrecognized.
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account FNS number not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
                  summary: Expired Session Token
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: expired_session_token
                      message: This token has expired
                      source:
                        resource: Session_Token
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/payments/{payment_ref}/void/
                    errors:
                    - code: invalid_token
                      message: Invalid Token
                      source:
                        resource: OAuth_Access_Tokens
        '404':
          description: Not Found
          content:
