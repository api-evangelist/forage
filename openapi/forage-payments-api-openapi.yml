openapi: 3.2.0
info:
  title: Forage Payments API
  description: The Forage Payments API is a REST API for processing Electronic Benefits Transfer (EBT) payments (SNAP and EBT Cash) in your e-commerce or in-store application.
  contact:
    name: API Support
    email: engineering@joinforage.com
  version: '2025-08-04'
servers:
- url: https://{environment}.joinforage.app
  variables:
    environment:
      default: api.sandbox
      enum:
      - api
      - api.sandbox
security: []
tags:
- name: Payments
paths:
  /api/orders/{order_ref}/payments/{payment_ref}/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `OrderPayment` object, returned when the [`OrderPayment` was created](https://docs.joinforage.app/reference/create-order-payment).
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    patch:
      parameters:
      - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
      - $ref: '#/components/parameters/MerchantAccountHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      tags:
      - Payments
      summary: Update an OrderPayment
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request PATCH \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/payments/cc3175bfea/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"external_order_id\": \"<external-order-id>\"\n}\n'\n"
      description: '> ⚠️ Update `OrderPayment` Server-Side Only

        >

        > To keep your app secure, requests to update an `OrderPayment` should only be generated on the server-side.


        A `PATCH` request to `/orders/{order_ref}/payments/{payment_ref}/` updates an existing Forage `OrderPayment`.


        On success, the API responds with the updated OrderPayment object.


        The `status` property of the `OrderPayment` determines what data can be updated. If the `status` is `processing`, `canceled`, or `succeeded`, then only the following `Payment` fields can be modified:


        - `metadata`

        - `external_order_id`


        During these statuses, Forage ignores attempts to update other `OrderPayment` fields.'
      operationId: PATCHUpdateAnOrderPayment
      security:
      - OAuth2:
        - internal
        - pinpad_only
      - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/Payment'
      responses:
        '200':
          description: __OK__ - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentResponse'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body:
                  summary: Cannot Parse Request Body
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: cannot_parse_request_body
                      message: Parsing 'payment_method' field failed
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                different_ebt_card:
                  summary: Different EBT Card
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: different_ebt_card
                      message: Order {order_ref} already has EBT Payment {payment_ref} with payment_method {payment_method_ref}. Your request included payment_method {payment_method_ref}. You must use the same EBT payment_method for all EBT Payments on an Order
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                duplicate_funding_type:
                  summary: Duplicate funding type
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: duplicate_funding_type
                      message: Order {order_ref} already has payment {payment_ref} with funding_type {funding_type}. Please modify the existing payment object instead of adding new payments with the same funding_type
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                exceeds_ebt_cash_total:
                  summary: Exceeds EBT Cash total
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: exceeds_ebt_cash_total
                      message: Order {order_ref} has EBT-Cash payments {payment_ref} with amounts that combined exceed the Cash eligible total of {cash_total}. Please update the Order Payments before capturing the order
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                exceeds_snap_total:
                  summary: Exceeds SNAP total
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: exceeds_snap_total
                      message: Order {order_ref} has EBT-SNAP payments {payment_ref} with amounts that combined exceed the SNAP eligible total of {cash_total}. Please update the Order Payments before capturing the order
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                order_is_cancelled:
                  summary: Order Is Cancelled
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: order_is_cancelled
                      message: Order {order_ref} has been cancelled and therefore cannot have new payments added. Please create a new order to continue.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_field_update_error:
                  summary: Immutable Fields
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: invalid_field_update_error
                      message: Immutable fields {invalid_update_fields} cannot be updated
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '404':
          description: __Not Found__ - The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/orders/{order_ref}/payments/{payment_ref}/
                errors:
                - code: resource_not_found
                  message: Order with ref {order_ref} does not exist for current Merchant with FNS {fns_number}
                  source:
                    resource: Orders
                    ref: '{order_ref}'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/orders/{order_ref}/payments/{payment_ref}/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
      x-operation-id-source: normalized
      x-operation-id-original: PATCH Update an order payment
  /api/payments/:
    post:
      parameters:
      - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
      - $ref: '#/components/parameters/MerchantAccountHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/APIVersionHeader'
      tags:
      - Payments
      summary: Create a Payment
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/payments/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"amount\": 25.99,\n  \"funding_type\": \"ebt_snap\",\n  \"payment_method\": \"ac47392bb1\",\n  \"delivery_address\": {\n    \"city\": \"San Francisco\",\n    \"country\": \"US\",\n    \"line1\": \"1856 Market St.\",\n    \"zipcode\": \"94106\",\n    \"state\": \"CA\"\n  },\n  \"is_delivery\": true,\n  \"description\": \"An EBT payment\",\n  \"metadata\": {},\n  \"platform_fee\": 0.05,\n  \"platform_fixed_settlement\": 5.11,\n  \"merchant_fixed_settlement\": 5.95,\n  \"customer_id\": \"cus_1234567890\",\n  \"external_order_id\": \"<external-order-id>\",\n  \"merchant_destination_account\": \"1bdefaa456\",\n  \"pos_terminal\": {\n    \"provider_terminal_id\": \"tbd123\"\n  },\n  \"external_location_id\": \"6e3b2ff7-51c8-4c64-befa-2eac90f7c3e9\"\n}\n'\n"
      description: '> ⚠️ Payment Creation Must Be Server-Side

        >

        > To keep your app secure, requests to create a Payment should only be generated on the server-side.


        A `POST` request to `/payments/` tells Forage’s servers how much to charge an existing `PaymentMethod`.


        On success, the API responds with a Forage `Payment` object that represents the one-time charge. You need to pass the `ref` response value to an SDK function to authorize and capture the payment, one of:


        - Forage JS: `capturePayment()`

        - Android: `capturePayment()`

        - iOS: `capturePayment()`


        > 📘 Use `customer_id` When Creating Payments

        >

        > Pass `customer_id` in the request to Create a `Payment`. `customer_id` helps Forage''s servers more quickly identify and associate the correct customer with the `Payment`. While `customer_id` is not technically a required parameter, if you omit it then the request to create the `Payment` could take longer to process. **It is strongly recommended to pass `customer_id`.**

        >

        > Each customer should only have one unique `customer_id`. For example, if you create both a `Payment` and a `PaymentMethod` for the same customer, then the `customer_id` should be the same in both requests to ensure continuity of stored payment methods.


        > ⚠️ Payments Expire After 30 Minutes

        >

        > `Payment` objects expire after 30 minutes. If a `Payment` is not captured or canceled within 30 minutes of when it''s created, then it expires. To attempt the transaction again, create a new `Payment`.'
      operationId: CreateAPayment(customCheckout)
      security:
      - OAuth2:
        - pinpad_only
      - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreatePayment'
      responses:
        '200':
          description: OK - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body:
                  summary: Cannot parse request body
                  value:
                    path: /api/payments/
                    errors:
                    - code: cannot_parse_request_body
                      message: 'Parsing payment_method field failed with message: Object with ref={payment_method_ref} does not exist.'
                      source:
                        resource: Payments
                amount_mismatch:
                  summary: Amount mismatch
                  value:
                    path: /api/payments/
                    errors:
                    - code: amount_mismatch
                      message: 'Payment amount needs to equal to products amount. Payment amount: {payment_amount}, products amount: {products_amount}.'
                      source:
                        resource: Payments
                inconsistent_funding_and_payment_method:
                  summary: Inconsistent funding and payment method
                  value:
                    path: /api/payments/
                    errors:
                    - code: inconsistent_funding_and_payment_method
                      message: Payment was posted with a funding_type of {funding_type}, but the payment_method is {card_type} card.
                      source:
                        resource: Payments
                invalid_input_data:
                  summary: Invalid input data
                  value:
                    path: /api/payments/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Payments
                card_not_reusable:
                  summary: Card not reusable
                  value:
                    path: /api/payments/
                    errors:
                    - code: card_not_reusable
                      message: Payment method {payment_method_ref} is not reusable
                      source:
                        resource: Payment_Methods
                        ref: '{payment_method_ref}'
                different_ebt_card:
                  summary: Different EBT Card
                  value:
                    path: /api/payments/
                    errors:
                    - code: different_ebt_card
                      message: Order {order_ref} already has EBT Payment {payment_ref} with payment_method {payment_method_ref}. Your request included payment_method {payment_method_ref}. You must use the same EBT payment_method for all EBT Payments on an Order
                      source:
                        resource: Payment_Methods
                        ref: '{payment_method_ref}'
                duplicate_funding_type:
                  summary: Duplicate funding type
                  value:
                    path: /api/payments/
                    errors:
                    - code: duplicate_funding_type
                      message: Order {order_ref} already has payment {payment_ref} with funding_type {funding_type}. Please modify the existing payment object instead of adding new payments with the same funding_type
                      source:
                        resource: Payments
                        ref: '{payment_ref}'
                invalid_merchant_account:
                  summary: Invalid merchant account
                  value:
                    path: /api/payments/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/payments/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/payments/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                settlement_greater_than_amount:
                  summary: Settlement Greater Than Amount
                  value:
                    path: /api/payments/
                    errors:
                    - code: settlement_greater_than_amount
                      message: merchant_fixed_settlement + platform_fixed_settlement must be equal to or less than the amount charged. Fixed settlement charged of {settlement_amount} is greater than amount of {amount_charged}
                      source:
                        resource: Payments
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    path: /api/payments/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: OAuth_Access_Tokens
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/payments/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '423':
          $ref: '#/components/responses/Error423'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/payments/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Payments
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/payments/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                ebt_processor_timeout:
                  summary: EBT processor timeout
                  value:
                    path: /api/payments/
                    errors:
                    - code: ebt_processor_timeout
                      message: Unable to contact EBT processor, please try again shortly.
                      source:
                        resource: Payments
                        ref: ''
      x-operation-id-source: normalized
      x-operation-id-original: Create a payment (custom checkout)
    get:
      parameters:
      - $ref: '#/components/parameters/BearerTokenHeader'
      - $ref: '#/components/parameters/MerchantAccountHeader'
      - $ref: '#/components/parameters/APIVersionHeader'
      - name: external_order_id
        in: query
        required: true
        schema:
          type: string
          default: 1f2ee410-5b47-4130-aec2-40f5eb2108f5
        description: 'A unique, merchant or platform-provided identifier for the order that corresponds to their own database, as provided in the original request to [create the `Payment`](https://docs.joinforage.app/reference/create-a-payment).


          Only one `external_order_id` can be passed as a query param at a time.


          **You must build with Forage Version `2023-05-15` or later to use `external_order_id`.** Either pass `2023-05-15` as the `API-Version` header on a per request basis, or set the version for all requests in the Forage dashboard.

          '
      - name: with_refunds
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: 'Include this parameter to expand the `refunds` list to full `Refund` objects. This provides complete refund details including amount, status, reason, and other refund-specific information.


          If omitted, the `refunds` field contains only refund reference strings. Pass as `&with_refunds` (no value needed). Examples may show `with_refunds=true` for clarity, but only the presence of the parameter is required.

          '
      tags:
      - Payments
      summary: Retrieve all Payments for a merchant order ID
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n    --url 'https://api.sandbox.joinforage.app/api/payments/?external_order_id=<external-order-id>&with_refunds' \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'accept: application/json'\n"
      description: 'A `GET` request to `/payments/` that includes the `external_order_id` query param retrieves a list of all of the `Payment`s related to the order. The `external_order_id` corresponds to a merchant or platform''s identifier for the order in their own database. Forage does not provide this value.


        If a customer charges both SNAP and EBT Cash at checkout, then this endpoint could be useful to review the spending breakdown across `Payment` types.


        **Refund details:** By default, the `refunds` field contains only refund reference strings. Include `with_refunds` to get complete refund information. You can pass it as `&with_refunds` (no `=true` required).'
      operationId: GetPaymentDetailsByMerchantId.
      security:
      - OAuth2:
        - pinpad_only
      - BearerAuth: []
      responses:
        '200':
          description: __OK__ - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsResponse'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Payments
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
                  summary: Expired Session Token
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: expired_session_token
                      message: This token has expired
                      source:
                        resource: Session_Token
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: invalid_token
                      message: Invalid Token
                      source:
                        resource: OAuth_Access_Tokens
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                resource_not_found:
                  summary: Resource Not Found
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: resource_not_found
                      message: Could not find any payments associated with {external_order_id}
                      source:
                        resource: Payments
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/payments/?external_order_id={external_order_id}
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Payments
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
