                          type: string
                          description: Two-letter state code (e.g., "MA" for Massachusetts), as defined by USPS.
                        bin:
                          type: string
                          description: A unique identifier that helps determine the issuer of a payment card and guides how transactions are processed.
                        pan_lengths:
                          type: array
                          items:
                            type: integer
                          description: A list of acceptable PAN lengths for the state.
