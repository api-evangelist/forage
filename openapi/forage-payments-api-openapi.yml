            example: 45e3f12a90
          order:
            type: string
            description: The unique reference hash for the parent Forage `Order`.
            example: 83b1c754ae
          funding_type:
            type: string
            description: 'A string that represents the type of tender. One of:


              - `benefit`

              - `credit_payfac`

              - `credit_tpp`

              - `ebt_cash`

              - `ebt_snap`

              - `wic`

