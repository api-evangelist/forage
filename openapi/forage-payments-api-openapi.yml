  /api/payments/{payment_ref}/capture_payment/:
    parameters:
    - name: payment_ref
      in: path
      description: A unique reference hash for the Forage `Payment` object, returned when the [`Payment` was created](https://docs.joinforage.app/reference/payments#create-a-payment).
      required: true
      schema:
        type: string
