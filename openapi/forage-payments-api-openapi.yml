openapi: 3.0.0
info:
  title: Forage Payments API
  description: 'The Forage Payments API is a REST API for processing Electronic Benefits Transfer (EBT) payments (SNAP and EBT Cash) in your e-commerce or in-store application.


    Processing any EBT payment, or checking an EBT card''s balance, requires the cardholder''s PIN. Federal regulations require all PIN entry to happen through a PCI-compliant, USDA-approved interface. Forage provides that interface, so EBT PIN collection always happens through a Forage-hosted surface (Forage Checkout or a Forage SDK), never directly in your own form. Some endpoints (for example, capture and balance) are only reachable through that surface because they require PIN data in the request.


    EBT rarely covers an entire order: items like delivery fees and non-eligible products can''t be paid with SNAP or EBT Cash. You decide how to handle the remaining balance (split tender) and any credit or debit processing alongside the EBT portion.


    Forage offers four integration options. Pick the one that fits your platform and engineering resources:


    1. **Fully Hosted Checkout.** Forage processes EBT and credit/debit through a Forage-hosted Checkout UI. Lowest engineering effort, and Forage absorbs most error handling. See the [Fully Hosted Checkout guide](https://docs.joinforage.app/docs/fully-hosted).

    2. **Custom Checkout.** Forage processes EBT; you handle split tender, taxes, and credit/debit in your own checkout flow. Best when you want minimal changes to your existing UX. See the [Custom Checkout guide](https://docs.joinforage.app/docs/custom).

    3. **Online SDKs.** Client-side SDKs for [web](https://docs.joinforage.app/docs/forage-js), [iOS](https://docs.joinforage.app/docs/ios), and [Android](https://docs.joinforage.app/docs/android) that collect EBT PINs in your app while keeping you out of PCI scope.

    4. **POS Terminal SDK.** Accept in-person EBT payments on an Android POS device. See the [POS Terminal guide](https://docs.joinforage.app/docs/forage-terminal-android).


    As a general principle, any data created by your requests, or by your customers on a Forage-hosted surface, is retrievable through GET requests to the appropriate resource.


    Have more questions? Use our [contact form](https://www.joinforage.com/get-in-touch) to reach our sales and engineering support teams.

    '
  contact:
    name: API Support
    email: engineering@joinforage.com
  version: '2025-08-04'
externalDocs:
  description: Forage documentation
  url: https://docs.joinforage.app/
servers:
- url: https://{environment}.joinforage.app
  variables:
    environment:
      default: api.sandbox
      enum:
      - api
      - api.sandbox
security: []
paths:
  /api/balance_sessions/:
    parameters:
    - $ref: '#/components/parameters/BearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    post:
      tags:
      - Custom Sessions
      summary: Create a Custom Balance Check Session
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/balance_sessions/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"payment_method\": \"b16673fe21\",\n  \"success_redirect_url\": \"https://www.your-app.com/?status=SUCCEEDED\",\n  \"cancel_redirect_url\": \"https://www.your-app.com/?status=CANCELED\"\n}\n'\n"
      description: '> ⚠️ FNS Requirements

        >

        > FNS prohibits balance inquiries on sites and apps that offer guest checkout. Do not use this endpoint if your customers can opt for guest checkout.

        >

        > If guest checkout is not an option, then it''s up to you whether or not to add a balance inquiry feature. No FNS regulations apply.


        A `POST` request to `/balance_sessions/` initiates a `Session` of the Custom Balance Check Forage UI.


        Pass the Forage [`PaymentMethod`](https://docs.joinforage.app/reference/payment-methods) `ref`, the hashed reference ID that represents the EBT Card, as the `payment_method` param in the request body.


        The response payload represents the [Custom Balance Check `Session`](https://docs.joinforage.app/reference/forage-sessions#custom-balance-check-session). The `redirect_url` value is the URL that launches the front-end, customer-facing Forage UI. Point a customer to this URL to enter their PIN to perform a secure balance inquiry.


        If PIN entry is successful, then Forage points the customer to the `success_redirect_url` specified in the request body. Forage directs them to the `cancel_redirect_url` if they cancel the balance inquiry via the Forage UI.


        > 📘 Retrieve Customer EBT Card Balance

        >

        > After a customer completes the Forage UI and is pointed to your `success_redirect_url`, send a `GET` to [`/api/payment_methods/{payment_method_ref}/`](https://docs.joinforage.app/reference/get-payment-method) and inspect the `balance` field of the response to retrieve their EBT Card balance.


        See these guide for additional information:


        - [How Custom integrations work (Check the balance of an EBT account)](https://docs.joinforage.app/docs/custom#check-the-balance-of-an-ebt-account)

        - [Custom Quickstart](https://docs.joinforage.app/docs/custom-quickstart)

        - [Custom Balance Check `Session` payload](https://docs.joinforage.app/reference/forage-sessions#custom-balance-check-session)

        '
      operationId: Create balance session
      security:
      - OAuth2:
        - pinpad_only
      requestBody:
        $ref: '#/components/requestBodies/BalanceSession'
      responses:
        '200':
          $ref: '#/components/responses/BalanceSession200'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body:
                  summary: Cannot Parse Request Body
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: cannot_parse_request_body
                      message: 'Parsing ''payment_method'' field failed with message: This field is required.'
                      source:
                        resource: Sessions
                        ref: ''
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Sessions
                        ref: ''
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Sessions
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
                  summary: Expired Session Token
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: expired_session_token
                      message: This token has expired
                      source:
                        resource: Session_Token
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '423':
          $ref: '#/components/responses/Error423'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Sessions
                        ref: ''
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/balance_sessions/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
  /api/balance_sessions/{session_ref}/:
    parameters:
    - name: session_ref
      in: path
      description: A unique identifier for the Custom Balance Check Session, returned as the `ref` value in the response payload of the `POST` request that created the `Session`.
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/BearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    get:
      tags:
      - Custom Sessions
      summary: Retrieve a Custom Balance Check Session
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n    --url https://api.sandbox.joinforage.app/api/balance_sessions/<balance_session_ref>/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'accept: application/json'\n"
      description: '> ⚠️ Check EBT Card Balance

        >

        > This endpoint does not return a customer''s EBT Card balance. If you’re looking for a customer''s EBT Card balance, then send a `GET` to [`/api/payment_methods/{payment_method_ref}`](https://docs.joinforage.app/reference/get-payment-method), and inspect the `balance` response field.


        A `GET` request to `/balance_sessions/` retrieves the properties of a Custom Balance Check Session.


        Use this endpoint to inspect a `Session`''s `success_redirect_url` and `cancel_redirect_url` values.


        See these guides for additional information:


        - [Create a Custom Balance Check `Session`](https://docs.joinforage.app/reference/create-custom-balance-check-session)

        - [Custom Balance Check `Session` payload](https://docs.joinforage.app/reference/forage-sessions#custom-balance-check-session)

        - [How Custom integrations work (Check the balance of an EBT account)](https://docs.joinforage.app/docs/custom#check-the-balance-of-an-ebt-account)

        - [Custom Quickstart](https://docs.joinforage.app/docs/custom-quickstart)

        '
      operationId: View balance session
      security:
      - OAuth2:
        - internal
        - pinpad_only
      responses:
        '200':
          $ref: '#/components/responses/BalanceSession200'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Sessions
                        ref: '{session_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Sessions
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
                  summary: Expired Session Token
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: expired_session_token
                      message: This token has expired
                      source:
                        resource: Session_Token
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '404':
          description: __Not Found__ - The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              example:
                path: /api/balance_sessions/{session_ref}/
                errors:
                - code: resource_not_found
                  message: Balance session with ref {session_ref} does not exist for current Merchant with FNS {fns_number}
                  source:
                    resource: Sessions
                    ref: '{session_ref}'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Sessions
                        ref: ''
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/balance_sessions/{session_ref}/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
  /api/capture_sessions/:
    parameters:
    - $ref: '#/components/parameters/AuthenticationBearerTokenHeader'
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/IdempotencyKeyHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    post:
      tags:
      - Custom Sessions
      summary: Create a Custom Payment Capture Session
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n    --url https://api.sandbox.joinforage.app/api/capture_sessions/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'Idempotency-Key: <idempotency-key>' \\\n    --header 'accept: application/json' \\\n    --header 'content-type: application/json' \\\n    --data '\n{\n  \"success_redirect_url\": \"https://www.your-app.com/?status=SUCCEEDED\",\n  \"cancel_redirect_url\": \"https://www.your-app.com/?status=CANCELED\",\n  \"delivery_address\": {\n    \"city\": \"San Francisco\",\n    \"country\": \"US\",\n    \"line1\": \"1856 Market St.\",\n    \"zipcode\": \"94106\",\n    \"state\": \"CA\"\n  },\n  \"is_delivery\": true,\n  \"payment_details\": {\n    \"snap_payment\": {\n      \"amount\": 20.12,\n      \"payment_method\": \"fsdf45345\",\n      \"description\": \"A SNAP payment\",\n      \"funding_type\": \"ebt_snap\",\n      \"metadata\": {}\n    }\n  },\n  \"customer_id\": \"cus_1234567890\"\
            ,\n  \"external_order_id\": \"<external-order-id>\"\n}\n'\n"
      description: "A `POST` request to `/capture_sessions/` initiates a `Session` of the Forage Custom Payment Capture UI.\n\nThe response payload represents the [Custom Payment Capture Session](https://docs.joinforage.app/reference/forage-sessions#custom-payment-capture-session). The `ref` and `redirect_url` fields are the most important:\n\n  - `ref` represents the `Order`\n    - Store this `ref` so that you can pass it in a future request to [Create an `Order` Payment](https://docs.joinforage.app/reference/create-order-payment), or to check the status of the `Order` via a `GET` to [`/orders/{order_ref}/`](https://docs.joinforage.app/reference/get-order)\n  - `redirect_url` is the URL that launches the front-end, customer-facing Forage UI\n    - Point customers to this URL to enter their PIN to complete checkout\n\nIf PIN entry is successful, then Forage points the customer to the `success_redirect_url` specified in the request body. Forage directs the customer to the `cancel_redirect_url`\
        \ if they cancel the balance inquiry from the Forage UI.\n\nTo check the status of an `Order` after the customer completes the Forage UI, send a `GET` to [`/orders/{order_ref}/`](https://docs.joinforage.app/reference/get-order).\n\n> \U0001F4D8 Use customer_id For Better Performance\n>\n> Pass `customer_id` in the request to Create a Capture Session.\n>\n> Forage automatically adds the `customer_id` to the Session's corresponding `Order` and `OrderPayments`.\n>\n> `customer_id` helps Forage's servers more quickly identify and associate the correct customer with the `Session`. While `customer_id` is not technically a required parameter, if you omit it then the request to create the Session could take longer to process. **It is strongly recommended to pass `customer_id`.**\n>\n> When the same `customer_id` is provided for a returning customer, Forage will retrieve and reuse their stored payment method, if available. Alternatively, passing the same `ebt_payment_method` can also pre-fill\
        \ the stored payment method in the checkout session.\n>\n> Each customer should only have one unique `customer_id`. For example, if you create both a Capture Session and a `PaymentMethod` for the same customer, then the `customer_id` should be the same in both requests to ensure continuity of stored payment methods.\n"
      operationId: Create capture session
      security:
      - OAuth2:
        - pinpad_only
      requestBody:
        $ref: '#/components/requestBodies/CaptureSession'
      responses:
        '200':
          $ref: '#/components/responses/CustomPaymentCapture200'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_parse_request_body:
                  summary: Cannot Parse Request Body
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: cannot_parse_request_body
                      message: 'Parsing ''payment_details'' field failed with message: This field is required.'
                      source:
                        resource: Sessions
                        ref: ''
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Sessions
                        ref: ''
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Sessions
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: invalid_token
                      message: Incorrect authentication credentials.
                      source:
                        resource: Accounts
                        ref: ''
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                cannot_change_request:
                  summary: Cannot Change Request
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: cannot_change_request
                      message: Two requests were submitted with the same idempotency key, but slightly different request bodies. Please use a new idempotency key if you intended to change the request body
                      source:
                        resource: Idempotency_Key
        '423':
          $ref: '#/components/responses/Error423'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                too_many_requests:
                  summary: Too Many Requests
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: too_many_requests
                      message: Request was throttled, please try again later.
                      source:
                        resource: Sessions
                        ref: ''
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                unknown_server_error:
                  summary: Unknown Server Error
                  value:
                    path: /api/capture_sessions/
                    errors:
                    - code: unknown_server_error
                      message: Unknown exception from EBT network
                      source:
                        resource: Unknown
  /api/orders/{order_ref}/:
    parameters:
    - name: order_ref
      in: path
      description: A unique reference hash for the Forage `Order` object, returned when the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions) was created.
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/MerchantAccountHeader'
    - $ref: '#/components/parameters/APIVersionHeader'
    get:
      parameters:
      - $ref: '#/components/parameters/BearerTokenHeader'
      tags:
      - Orders
      summary: Retrieve an Order
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n    --url https://api.sandbox.joinforage.app/api/orders/<order_ref>/ \\\n    --header 'Authorization: Bearer <api_key>' \\\n    --header 'Merchant-Account: <merchant-id>' \\\n    --header 'accept: application/json'\n"
      description: 'A `GET` request to `/orders/{order_ref}/` retrieves the specified [`Order` object](https://docs.joinforage.app/reference/orders#order-object).


        The `order_ref` is the `ref` value that Forage returns in response to the request that created the order’s parent [`Session`](https://docs.joinforage.app/reference/forage-sessions).


        You can use this endpoint to request the transaction outcome from Forage after a customer completes a Fully Hosted or Custom Session.

        '
      operationId: Get order
      security:
      - OAuth2:
        - hosted_checkout
        - pinpad_only
        - internal
      responses:
        '200':
          $ref: '#/components/responses/Order200'
        '400':
          description: __Bad request__ - The request was not accepted because of an error in the request body or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                invalid_input_data:
                  summary: Invalid Input Data
                  value:
                    path: /api/orders/{order_ref}/
                    errors:
                    - code: invalid_input_data
                      message: Query parameter missing or incomplete.
                      source:
                        resource: Orders
                        ref: '{order_ref}'
                invalid_merchant_account:
                  summary: Invalid Merchant Account
                  value:
                    path: /api/orders/{order_ref}/
                    errors:
                    - code: invalid_merchant_account
                      message: Merchant account Merchant ID not valid.
                      source:
                        resource: Merchants
                missing_idempotency_key:
                  summary: Missing Idempotency Key
                  value:
                    path: /api/orders/{order_ref}/
                    errors:
                    - code: missing_idempotency_key
                      message: You must include a value for the IDEMPOTENCY-KEY header in your requests to this endpoint.
                      source:
                        resource: Idempotency_Key
                missing_merchant_account:
                  summary: Missing Merchant Account
                  value:
                    path: /api/orders/{order_ref}/
                    errors:
                    - code: missing_merchant_account
                      message: No merchant account was provided.
                      source:
                        resource: Merchants
                unknown_fields_error:
                  summary: Unknown Fields Error
                  value:
                    path: /api/orders/{order_ref}/
                    errors:
                    - code: unknown_fields_error
                      message: 'Unknown field(s) provided: {unknown_fields}'
                      source:
                        resource: Orders
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseObject'
              examples:
                expired_session_token:
