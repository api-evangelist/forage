      properties:
        payment:
          type: string
          description: A unique reference hash for the Forage `OrderPayment` to be refunded, returned when the [`OrderPayment` was created](https://docs.joinforage.app/reference/create-order-payment).
        amount:
          type: string
          format: decimal
