            _This field is only returned in the response if it is passed in the original request body_.

            '
          example: ac47392bb1
    FullyHostedSessionRequest:
      allOf:
      - $ref: '#/components/schemas/SessionRequest'
      - type: object
        properties:
          product_list:
            type: array
            items:
              $ref: '#/components/schemas/ProductData'
            description: 'A list of products in the customer''s cart at checkout.


